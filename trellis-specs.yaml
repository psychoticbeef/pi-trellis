            - id: DD-15
              kind: detail_design
              title: Review-Command und paralleler Drei-Prüfer-Check
              body: 'src/review-prompt.ts exportiert buildReviewPrompt(range) und erzeugt einen unveränderlichen Auftrag an das Agent-Tool: change-review wird mit run_in_background=false im Foreground gestartet, erhält Projekt und Worktree sowie den optionalen Git-Range unverändert; ohne Range wird ausdrücklich der Worktree-Diff verlangt. src/check-prompt.ts nennt spec-sync-check, glossary-warden und relic-hunter, verlangt ihre drei Spawns in einem gemeinsamen parallelen Tool-Turn, führt Ergebnisse als Vorschläge zusammen und beschreibt für fehlendes Agent-Tool oder jeden fehlenden Typ den vollständigen Inline-Fallback. src/index.ts registriert trellis:review mit einem eigenständigen Aktivierungs-Guard für den Trellis-Modus und sendet den gebauten Prompt genau einmal; trellis:check behält seinen Guard und sendet den erweiterten CHECK_PROMPT.'
