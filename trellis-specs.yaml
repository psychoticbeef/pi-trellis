                        - test/package-layout.test.ts::UT-7 Package-Layout und Manifestregeln > UT-7 deklariert das Konventionsentry und pi-package
                        - test/package-layout.test.ts::UT-7 Package-Layout und Manifestregeln > UT-7 hält pi-Core-Pakete als ungebündelte Peers
                    recorded_at: "2026-08-30T15:07:59Z"
            - id: DD-8
              kind: detail_design
              title: Kurzes README für Installation und Nutzung
              body: README.md erklärt die lokale Ausführung mit pi -e <repo-pfad> und einen JSON-packages-Eintrag. Es beschreibt knapp /trellis:on, /trellis:off und /trellis:status und verwendet die Glossarbegriffe Trellis-Modus, Trellis-Kontextblock und Dateihinweis mit deren Verhalten. Ein Dokumenttest prüft diese Pflichtinhalte, ohne Formulierungen unnötig festzuschreiben.
              approved_content_hash: ffc3fcfa0e3f9b613c85e232118b878949bcdc22d82d57d77c923db367084f8b
              approved_parent_hash: 9377d1cd161d7dcd791453287b1e377261e6dbec94d6e2064f5eee65302f2053
              children:
