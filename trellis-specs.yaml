                  body: Unit-Tests prüfen Frontmatter und Body aller Templates, die read-only Werkzeugliste, die grundlegenden Rollen und die Synchronität mit den committeten .pi/agents-Dateien. Dateisystemtests prüfen projektlokalen und globalen Vorbestand, globale Neuanlage, bytegenaue Erhaltung vorhandener Dateien, wiederholte Aufrufe und konkurrierendes EEXIST-Verhalten. Jeder Testname enthält UT-11.
                  approved_content_hash: 6651676534decb23f2343bf581bf5b5939f59c0ec24576e86149b8527d344e97
                  approved_parent_hash: d0c7de54cbff2fe5314f51c205acaa36b726a8cfe4c3592d234088567ad9c092
                  evidence:
