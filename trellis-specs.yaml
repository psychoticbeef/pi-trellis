            recorded_at: "2026-08-30T15:07:59Z"
    - id: US-5
      kind: story
      title: Geführtes Projekt-Interview über /trellis:init
      body: Der Slash-Command /trellis:init erfordert einen aktiven Trellis-Modus und injiziert über pi.sendUserMessage einen im Code hinterlegten Interview-Prompt. Dieser führt das LLM schrittweise durch Projektbeschreibung, bestätigte Story-Vorschläge mit Given/When/Then-Akzeptanzkriterien, Querschnittsthemen, Glossar-Grundstock sowie abschließendes approve_tree und Refinement.
      status: done
      acceptance_criteria:
        - id: US-5.AC-1
          given: Der Trellis-Modus ist deaktiviert.
          when: Der User führt /trellis:init aus.
          then: Es wird kein Interview gestartet und der User erhält die konkrete Fehlermeldung, dass /trellis:init einen aktiven Trellis-Modus erfordert und zuerst /trellis:on auszuführen ist.
        - id: US-5.AC-2
          given: Der Trellis-Modus ist aktiviert.
          when: Der User führt /trellis:init aus.
          then: Der Command injiziert über pi.sendUserMessage genau einen im Code hinterlegten, strukturierten Interview-Prompt mit weniger als 2500 Zeichen.
        - id: US-5.AC-3
          given: Der Interview-Prompt wurde injiziert.
          when: Das LLM das Projekt-Interview durchführt.
          then: Es erarbeitet schrittweise mit dem User die Projektbeschreibung, schlägt anschließend 2–3 erste Stories mit Given/When/Then-Akzeptanzkriterien vor und legt sie erst nach ausdrücklicher Bestätigung an; danach erarbeitet es Querschnittsthemen als cross_cutting Specs und einen ultra-kurzen Glossar-Grundstock.
        - id: US-5.AC-4
          given: Der User hat die vorgeschlagenen Inhalte bestätigt und die Spec-Bäume wurden angelegt.
          when: Das Interview abgeschlossen wird.
          then: Der Interview-Prompt weist das LLM abschließend an, die vollständigen Bäume zu lesen, sie mit aktuellen Hashes via approve_tree zu approven und die Stories nach erfolgreicher Prüfung zu refinen.
      approved_content_hash: a92281da9969b41ef36601613ff964c3ed5b829fa29edecf46a8ebc05b9c35e1
      children:
        - id: AS-5
          kind: arch
          title: Slash-Command mit statischem Interview-Prompt
          body: 'Die TypeScript-pi-Extension exportiert einen statischen Interview-Prompt aus einem eigenen Modul und registriert /trellis:init neben den bestehenden Commands. Der Handler nutzt ausschließlich den In-Memory-Aktivierungszustand des Trellis-Modus: ohne aktiven Zustand sendet er über die vorhandene Trellis-Ausgabe eine konkrete Anleitung zu /trellis:on; mit aktivem Zustand übergibt er den Interview-Prompt genau einmal als String an pi.sendUserMessage. Der Prompt bleibt unter 2500 Zeichen und instruiert das LLM zu einem schrittweisen, bestätigungsgebundenen Trellis-Projekt-Interview einschließlich set_description, 2–3 Story-Vorschlägen mit Given/When/Then-Akzeptanzkriterien, cross_cutting Specs, ultra-kurzem Glossar-Grundstock, get_tree, approve_tree und Refinement. Unit-, Integrations- und Acceptance-Tests sichern Inhalt und Verdrahtung.'
          approved_content_hash: c1dea466cbaccf25b4b2710374520fa23ba2c0f1b5a2bcdd0c6191116ac15f25
          approved_parent_hash: a92281da9969b41ef36601613ff964c3ed5b829fa29edecf46a8ebc05b9c35e1
          children:
            - id: DD-10
              kind: detail_design
              title: Aktivierungsgeschützter init-Command
