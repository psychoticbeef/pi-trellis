                        - test/onboarding-prompt.test.ts::UT-27 Sicherer Onboarding-Prompt und Gate-Rezepte > UT-27 enthält die exakten TypeScript-, Go- und Python-Gate-Rezepte
                        - test/onboarding-prompt.test.ts::UT-27 Sicherer Onboarding-Prompt und Gate-Rezepte > UT-27 hält Gate-Konfiguration in der Shell-CLI und geht nahtlos ins Interview über
