stories:
    - id: US-1
      kind: story
      title: Trellis-Modus per Slash-Command steuern
      body: Eine TypeScript-pi-Extension erkennt das Trellis-Projekt aus AGENTS.md, validiert den Trellis-MCP-Server und aktiviert mit /trellis:on den Trellis-Modus. Sie zeigt den Link aus der Board-Adresse und injiziert danach je User-Turn einen Trellis-Kontextblock. /trellis:off deaktiviert ihn.
      status: done
      acceptance_criteria:
        - id: US-1.AC-1
          given: 'Im aktuellen Projektbaum existiert eine AGENTS.md mit trellis-project: <id>, und der Trellis-MCP-Server ist erreichbar.'
          when: Der User führt /trellis:on aus.
          then: Die Projekt-ID wird erkannt, der Trellis-Modus wird aktiviert und der Projektlink auf Basis der Board-Adresse ausgegeben; deren Standard ist http://127.0.0.1:7420.
        - id: US-1.AC-2
          given: Der Trellis-Modus ist aktiviert.
          when: Ein nachfolgender User-Turn verarbeitet wird.
          then: Ein aktueller Trellis-Kontextblock mit weniger als 1500 Zeichen wird injiziert; er enthält Description, Glossar, Kanban-Zähler je Status, die in_progress-Story einschließlich Worktree-Pfad und stale Nodes.
        - id: US-1.AC-3
          given: Keine gültige trellis-project-Angabe gefunden wird oder der Trellis-MCP-Server nicht erreichbar ist.
          when: Der User führt /trellis:on aus.
          then: Der Trellis-Modus bleibt deaktiviert, der User erhält eine konkrete Fehlermeldung zur Ursache, und es wird kein Projektlink als verfügbar ausgegeben.
        - id: US-1.AC-4
          given: Der Trellis-Modus ist aktiviert.
          when: Der User führt /trellis:off aus.
          then: Der Trellis-Modus wird deaktiviert, die Deaktivierung wird bestätigt, und ab dem nächsten User-Turn wird kein Trellis-Kontextblock mehr injiziert.
      approved_content_hash: 0b89b4203e7d47f677657e3b35aae174fe336e3a3b56142deabd8fcb999ea682
      children:
        - id: AS-1
          kind: arch
          title: TypeScript-pi-Extension für den Trellis-Modus
          body: Die Extension exportiert eine TypeScript-Factory für ExtensionAPI. Sie registriert /trellis:on, /trellis:off und before_agent_start. Ein Config-Port sucht von ctx.cwd aufwärts AGENTS.md, liest trellis-project sowie eine konfigurierbare Board-Adresse mit Standard http://127.0.0.1:7420. Ein MCP-Port startet pro Abfrage einen eigenen stdio-Client mit trellis serve --project <id> --board-addr off, führt JSON-RPC initialize aus und ruft get_overview über tools/call auf. /trellis:on setzt den sitzungsinternen Trellis-Modus erst nach erfolgreicher Erkennung und MCP-Abfrage und gibt /p/<id>/ relativ zur Board-Adresse aus. before_agent_start lädt je User-Turn den aktuellen Overview, formatiert einen Trellis-Kontextblock mit hartem Limit < 1500 Zeichen und hängt ihn an event.systemPrompt; /trellis:off löscht den aktiven Zustand. Abhängigkeiten auf Dateisystem, MCP-Prozess, Umgebung und UI werden injizierbar gehalten; die Factory startet keine langlebige Ressource.
          approved_content_hash: a5bfc2efc1b8527fbf36b51247a9081c38b1099d6e3e31589d98a973ccf7b951
          approved_parent_hash: 0b89b4203e7d47f677657e3b35aae174fe336e3a3b56142deabd8fcb999ea682
          children:
            - id: DD-1
              kind: detail_design
              title: Projektfindung und atomare Aktivierung
              body: 'src/config.ts implementiert findTrellisProject(cwd): aufwärts gerichtete, begrenzte Suche nach AGENTS.md, Parsing genau einer Zeile trellis-project: <id> sowie Normalisierung der Board-Adresse aus TRELLIS_BOARD_ADDRESS oder dem Standard http://127.0.0.1:7420. buildBoardUrl erzeugt mit URL und kodierter ID /p/<id>/. src/mcp-client.ts kapselt einen pro Abfrage gestarteten Prozess trellis serve --project <id> --board-addr off, tauscht zeilenbegrenzte JSON-RPC-Nachrichten initialize, notifications/initialized und tools/call für get_overview aus und beendet den Prozess auch bei Timeout, Abbruch oder Protokollfehler. src/index.ts hält den Trellis-Modus zunächst aus; /trellis:on baut alle Werte lokal auf und übernimmt den Zustand erst nach erfolgreicher Overview-Antwort. Getrennte Fehler für fehlende AGENTS.md-Angabe, Start-, Timeout-, Protokoll- und Toolfehler werden ohne verfügbaren Projektlink gemeldet.'
              approved_content_hash: 8d6d52ea47465d58258c9a7bdb4812c9664a6ef013b2020561b85e9339497e1e
              approved_parent_hash: a5bfc2efc1b8527fbf36b51247a9081c38b1099d6e3e31589d98a973ccf7b951
              children:
                - id: UT-1
                  kind: unit_test
                  title: Config, URL und Aktivierungszustand
                  body: 'Unit-Tests prüfen AGENTS.md-Aufwärtssuche und trellis-project-Parsing, Board-Adresse-Standard und Override, URL-Normalisierung mit abschließendem /p/<id>/ sowie atomaren Trellis-Modus: erst nach erfolgreichem get_overview aktiv, bei jeder Erkennungs- oder MCP-Fehlerklasse aus und ohne Projektlink. Der MCP-Client wird mit Fake-Prozess auf exakte Argumente, JSON-RPC-Sequenz, Timeout und sicheres Beenden geprüft; Umgebung, Dateisystem und UI sind Fakes. Der Testname enthält die ID dieses unit_test.'
                  approved_content_hash: 681dcdd5bdec19598ebaa9cd80ea25ae9a0c45b235b970bc3879562a475b1ad1
                  approved_parent_hash: 8d6d52ea47465d58258c9a7bdb4812c9664a6ef013b2020561b85e9339497e1e
                  evidence:
                    tests:
                        - test/config-and-mcp.test.ts::UT-1 Config, URL und MCP-Client > UT-1 findet trellis-project aufwärts und baut Default- sowie Override-URLs
                        - test/config-and-mcp.test.ts::UT-1 Config, URL und MCP-Client > UT-1 lehnt fehlende und mehrdeutige Projektangaben konkret ab
                        - test/config-and-mcp.test.ts::UT-1 Config, URL und MCP-Client > UT-1 sendet die exakte MCP-JSON-RPC-Sequenz mit den geforderten Spawn-Argumenten
                        - test/config-and-mcp.test.ts::UT-1 Config, URL und MCP-Client > UT-1 meldet einen nicht startbaren MCP-Prozess konkret
                        - test/config-and-mcp.test.ts::UT-1 Config, URL und MCP-Client > UT-1 beendet eine bereits abgebrochene MCP-Anfrage sofort
                        - test/config-and-mcp.test.ts::UT-1 Config, URL und MCP-Client > UT-1 beendet eine hängende MCP-Anfrage per Timeout
                    recorded_at: "2026-08-30T14:35:34Z"
            - id: DD-2
              kind: detail_design
              title: Begrenzte Kontextformatierung und Deaktivierung
              body: src/context.ts normalisiert Overview-Daten und erzeugt einen Trellis-Kontextblock mit den stabilen Überschriften Description, Glossar, Kanban, in_progress und stale. Kanban zählt Stories je geliefertem Status; in_progress enthält ID, Titel und Worktree-Pfad oder '-' bei keinem Eintrag. Der Formatter normalisiert Leerraum, kürzt Feldwerte deterministisch und markiert ausgelassene Listeneinträge mit …(+N), sodass block.length stets < 1500 bleibt und jeder Pflichtabschnitt erhalten bleibt. Der before_agent_start-Handler fragt bei aktivem Trellis-Modus pro User-Turn frisch über den MCP-Port ab und hängt genau einen Block an den System-Prompt. /trellis:off löscht Zustand und bestätigt; danach liefert der Hook keine Änderung.
              approved_content_hash: 145da247a5e53413595cc055e91860478d332364d5e024e4accbd237cbd63a12
              approved_parent_hash: a5bfc2efc1b8527fbf36b51247a9081c38b1099d6e3e31589d98a973ccf7b951
              children:
                - id: UT-2
                  kind: unit_test
                  title: Kontextlimit, Inhalte und Off-Semantik
                  body: Tabellengetriebene Unit-Tests speisen leere, normale und extrem große Overviews ein. Jeder Trellis-Kontextblock enthält Description, Glossar, Kanban, in_progress mit Worktree-Pfad und stale, bleibt gemäß JavaScript string.length < 1500 und kürzt deterministisch. Hook-Tests prüfen genau eine frische MCP-Abfrage und Injektion je aktivem User-Turn sowie nach /trellis:off weder MCP-Abfrage noch Injektion. Der Testname enthält die ID dieses unit_test.
                  approved_content_hash: 060404874886e20c7bcc6fcfb7011c6077566498d3088cc1a74055bbdb2b29a3
                  approved_parent_hash: 145da247a5e53413595cc055e91860478d332364d5e024e4accbd237cbd63a12
                  evidence:
                    tests:
                        - test/context.test.ts::UT-2 Trellis-Kontextblock und Off-Grundlagen > UT-2 enthält alle Pflichtabschnitte und Kanban-Zähler
                        - test/context.test.ts::UT-2 Trellis-Kontextblock und Off-Grundlagen > UT-2 bleibt mit extrem großen Daten deterministisch unter 1500 Zeichen
                        - test/context.test.ts::UT-2 Trellis-Kontextblock und Off-Grundlagen > UT-2 bildet leere Overview-Felder explizit ab
                        - test/context.test.ts::UT-2 Trellis-Kontextblock und Off-Grundlagen > UT-2 fragt pro aktivem User-Turn frisch ab und nach Off nicht mehr
                        - test/context.test.ts::UT-2 Trellis-Kontextblock und Off-Grundlagen > UT-2 injiziert bei Refresh-Fehlern keinen veralteten Overview
                        - test/context.test.ts::UT-2 Trellis-Kontextblock und Off-Grundlagen > UT-2 verwirft eine laufende Injektion wenn Off dazwischen ausgeführt wird
                    recorded_at: "2026-08-30T14:35:34Z"
            - id: IT-1
              kind: integration_test
              title: Pi-Hooks mit Trellis-MCP-Transport
              body: Ein Integrations-Test lädt die TypeScript-pi-Extension über einen ExtensionAPI-Testadapter in einem temporären Projekt mit AGENTS.md. Ein Fake-Prozess für trellis serve --project <id> --board-addr off beantwortet JSON-RPC initialize und tools/call get_overview über stdio. Der Test führt /trellis:on, before_agent_start und /trellis:off aus und prüft Zusammenspiel von Trellis-Modus, Board-Adresse, Projektlink und Trellis-Kontextblock einschließlich Worktree-Pfad. Fehlerfälle nutzen einen nicht startbaren beziehungsweise fehlschlagenden MCP-Prozess. Der Testname enthält die ID dieses integration_test.
              approved_content_hash: 4ddda69f01c54191701ae53fb3275513c7574853ff2742c1c8d28da414b95774
