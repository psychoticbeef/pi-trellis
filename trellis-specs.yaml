      children:
        - id: AS-11
          kind: arch
          title: Dateibasierte Rezepte mit sicherer globaler Provisionierung
          body: Die committeten .pi/agents/*.md sind die einzige Rezeptquelle. src/agent-recipes.ts löst diese Dateien über import.meta.url auf und provisioniert bei Aktivierung ausschließlich den globalen agents-Pfad, sofern weder ein projektlokales Subagent-Rezept noch ein globales Rezept existiert. Das plain-ESM-Skript scripts/install-agents.mjs ermittelt agent-dir aus PI_CODING_AGENT_DIR oder ~/.pi/agent, läuft nur für installierte Clones unter dessen git- oder npm-Unterbaum, respektiert PI_TRELLIS_SKIP_AGENT_INSTALL=1 und kopiert bei gültiger Installation überschreibend. package.json bindet es als postinstall ein; README erklärt globale Installation und projektlokale Nutzer-Overrides.
