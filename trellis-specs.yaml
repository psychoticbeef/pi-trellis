          given: Der Trellis-Modus ist aktiviert.
          when: /trellis:review mit optionalem Git-Range ausgeführt wird.
          then: Die Extension startet change-review im Foreground, übergibt den Range unverändert und zeigt dessen Bericht; bei deaktiviertem Trellis-Modus verweist sie auf /trellis:on.
        - id: US-7.AC-3
          given: Das read-only Subagent-Rezept relic-hunter wird ausgeführt.
          when: Es Repository und Trellis-Specs untersucht.
          then: Es prüft zuerst mechanisch mit npx tsc --noUnusedLocals --noUnusedParameters und – falls verfügbar – npx knip, nutzt andernfalls dokumentierte Heuristiken und meldet auskommentierte Blöcke, TODO-Leichen, veraltete Kommentare, ungenutzten Code, ungenutzte Imports und Dateien, Done-Knoten zu entferntem Verhalten, unbenutzte Glossar-Terme sowie nicht mehr existierende deklarierte Story-Pfade ausschließlich als belegte Lösch- oder Aktualisierungsvorschläge.
        - id: US-7.AC-4
          given: Trellis-Modus und Agent-Tool sind verfügbar.
          when: /trellis:check ausgeführt wird.
          then: spec-sync-check, glossary-warden und relic-hunter werden in einem gemeinsamen parallelen Tool-Turn gestartet und ihre read-only Vorschläge zusammengeführt; der bestehende vollständige Inline-Fallback bleibt für fehlendes Agent-Tool oder fehlende Agent-Typen erhalten.
        - id: US-7.AC-5
          given: Die Projektabhängigkeiten sind installiert.
          when: Der konfigurierte test_cmd ausgeführt wird.
          then: Die Vitest-Coverage-Konfiguration läuft mit @vitest/coverage-v8 als devDependency erfolgreich und erzeugt einen LCOV-Report.
      approved_content_hash: c609f52a275ad0ed92392ec01b586ad369ee3e6558007497603e1887b80e358e
      children:
        - id: AS-7
          kind: arch
          title: Statische Qualitätsrezepte und promptgesteuerte Agent-Ausführung
          body: Die bestehende buildfreie TypeScript-pi-Extension lädt die read-only Subagent-Rezepte change-review und relic-hunter aus den kanonischen .pi/agents-Dateien. Die globale Installation erfolgt überschreibend über postinstall; die Aktivierung provisioniert nur global create-if-absent, sofern weder ein projektlokaler Nutzer-Override noch ein globales Subagent-Rezept existiert. Ein neuer unveränderlicher REVIEW_PROMPT trägt den optionalen Git-Range und verlangt einen Foreground-Spawn von change-review; /trellis:review nutzt den vorhandenen Aktivierungs-Guard und pi.sendUserMessage. CHECK_PROMPT verlangt einen gemeinsamen parallelen Agent-Tool-Turn für spec-sync-check, glossary-warden und relic-hunter mit vollständigem read-only Inline-Fallback. package.json und Lockfile deklarieren @vitest/coverage-v8, sodass der konfigurierte Coverage-Lauf einen LCOV-Report schreiben kann.
          approved_content_hash: b8424ada1ecd8235acd21c4a8eeb7d76c91c071f704adb6ee6bbb453fa5d4e88
          approved_parent_hash: c609f52a275ad0ed92392ec01b586ad369ee3e6558007497603e1887b80e358e
