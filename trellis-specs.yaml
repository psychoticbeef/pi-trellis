                  title: UT-8 README-Pflichtinhalte
                  body: Unit-Tests lesen README.md und prüfen Installationskommando, packages-Beispiel, alle drei Commands sowie Trellis-Kontextblock und Dateihinweis. Jeder Testname enthält UT-8.
                  approved_content_hash: a380c5c1b4e2003c1e9b377f61cba2523c1a5dd0574405fefa6f3c32c1ada13e
                  approved_parent_hash: ffc3fcfa0e3f9b613c85e232118b878949bcdc22d82d57d77c923db367084f8b
                  evidence:
                    tests:
                        - test/readme.test.ts::UT-8 README-Pflichtinhalte > UT-8 dokumentiert Installation, Commands, Trellis-Kontextblock und Dateihinweis
                    recorded_at: "2026-08-30T15:07:59Z"
            - id: IT-4
              kind: integration_test
              title: IT-4 TypeScript-Package-Entry lädt die Extension
              body: Eine Integration-Suite importiert extensions/index.ts ohne vorherigen Build, vergleicht dessen Default-Export mit der bestehenden Extension-Factory und registriert ihn an einem Pi-Harness. Sie prüft, dass /trellis:on, /trellis:off, /trellis:status und /trellis:init verfügbar sind. Der Testname enthält IT-4.
