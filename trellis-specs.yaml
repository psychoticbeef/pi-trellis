    - id: US-13
      kind: story
      title: Auto-Modus für fortlaufende Story-Umsetzung
      body: Die TypeScript-pi-Extension steuert mit /trellis:auto on und /trellis:auto off einen sitzungsgebundenen Auto-Modus. Er wählt jeweils die nächste startbare Story, beauftragt den Agenten mit ihrer vollständigen Umsetzung und setzt nach erfolgreichem finish fort, bis keine Story mehr startbar ist oder der User ihn deaktiviert.
      status: done
      paths:
        - README.md
        - src/auto-mode.ts
        - src/index.ts
        - src/mcp-client.ts
        - test/auto-mode.test.ts
        - test/harness.ts
        - test/integration-package.test.ts
      acceptance_criteria:
        - id: US-13.AC-1
          given: Der Trellis-Modus ist aktiv, der Auto-Modus ist aus und mindestens eine Story ist startbar.
          when: Der User /trellis:auto on ausführt.
          then: Der Auto-Modus fragt trellis_next_story ab, wählt deterministisch die erste gelieferte Story und sendet dem Agenten einen User-Turn mit Story-ID, Titel und Auftrag zur vollständigen Umsetzung über start bis finish.
        - id: US-13.AC-2
          given: Der Auto-Modus ist aktiv und die aktuelle Story erreicht ein erfolgreiches trellis_transition mit action=finish.
          when: Der Agent vollständig zur Ruhe gekommen ist.
          then: Die Extension prüft die aktuelle Kontextnutzung; bei höchstens 75 Prozent fordert sie direkt die nächste startbare Story an, bei mehr als 75 Prozent startet sie zuerst Compaction und fordert die nächste Story erst nach erfolgreicher Compaction an.
        - id: US-13.AC-3
          given: Der Auto-Modus ist aktiv oder eine Fortsetzung nach finish beziehungsweise Compaction steht aus.
          when: Der User /trellis:auto off ausführt.
          then: Der Auto-Modus wird sofort deaktiviert, ausstehende Callbacks werden entwertet und kein weiterer automatischer User-Turn wird erzeugt; laufende Story-Umsetzung bleibt unberührt.
        - id: US-13.AC-4
          given: Der Auto-Modus sucht die nächste startbare Story.
          when: trellis_next_story keine Story liefert.
          then: Der Auto-Modus wird deaktiviert und die UI meldet, dass keine startbaren Stories mehr vorhanden sind.
        - id: US-13.AC-5
          given: Der Auto-Modus verarbeitet Aktivierung, Sitzungswechsel oder einen fehlgeschlagenen finish-Aufruf.
          when: Argumente ungültig sind, kein Trellis-Modus aktiv ist, session_start läuft oder finish fehlschlägt.
          then: Ungültige Aktivierung wird mit Usage-Hinweis abgelehnt, fehlender Trellis-Modus wird konkret gemeldet, session_start setzt den Auto-Modus zurück und nur erfolgreicher finish löst eine Fortsetzung aus.
      approved_content_hash: f06604fa9383af922ae3ca177992922a1d10404c4711b0cf511ec7af32277fed
      children:
        - id: AS-13
          kind: arch
          title: Sitzungsgebundene Auto-Modus-Orchestrierung über pi-Events
          body: Die bestehende TypeScript-pi-Extension ergänzt einen sitzungsgebundenen Auto-Modus mit Generationenschutz. /trellis:auto on erfordert einen aktiven Trellis-Modus; /trellis:auto off ist jederzeit idempotent ausführbar. Ein Auto-Modus-Port fragt trellis_next_story über den vorhandenen kurzlebigen MCP-Transport ab und erzeugt einen deterministischen Umsetzungsauftrag für die erste gelieferte Story. tool_result erkennt ausschließlich erfolgreiche finish-Aufrufe; agent_settled startet danach die Fortsetzung. ctx.getContextUsage und ctx.model.contextWindow bestimmen Nutzung > 75 Prozent. ctx.compact läuft nicht-blockierend; nur sein erfolgreicher, noch aktueller Callback setzt fort. session_start, off, leere Story-Auswahl und Fehler entwerten ausstehende Arbeit. Der Auto-Modus verändert weder Review-Gate noch laufende Story-Umsetzung.
          approved_content_hash: 6a54a68947e6d0652a946773744167c936a92e3cb5ede9c02a15eaaa4b080756
          approved_parent_hash: f06604fa9383af922ae3ca177992922a1d10404c4711b0cf511ec7af32277fed
          children:
            - id: DD-29
              kind: detail_design
              title: Reiner Auto-Modus-Zustand und Story-Auswahl
              body: src/auto-mode.ts kapselt Auto-Modus-Zustand, Generationen, pending-finish-Story und laufende Fortsetzung. Reine Helfer validieren on/off-Argumente, wählen aus der normalisierten trellis_next_story-Antwort deterministisch den ersten Kandidaten, erzeugen einen knappen User-Turn mit Story-ID, Titel sowie Auftrag zu start, Implementierung, Tests und finish und berechnen Nutzung als tokens / contextWindow. Fehlende oder ungültige Werte lösen keine Compaction aus. Jeder asynchrone Schritt prüft die Generation erneut, damit off und session_start keine spätere Nachricht zulassen.
              approved_content_hash: 9b122f9150271e95ffc6fbb47bd129644b24d539f6c95ee7502d6d06a561510c
              approved_parent_hash: 6a54a68947e6d0652a946773744167c936a92e3cb5ede9c02a15eaaa4b080756
