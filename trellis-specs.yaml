        - id: AT-4
          kind: acceptance_test
          title: AT-4 Installierbares und dokumentiertes pi-Package
          body: Eine Black-box-Suite betrachtet das Repository als Package-Root. Sie prüft, dass der TypeScript-Entry ohne Build importierbar ist, npm pack die Extension- und Quelldateien sowie README enthält und keine dist-Ausgabe benötigt, dass das Manifest pi-Core-Pakete nur als peers ausweist und dass README Installation, Commands, Trellis-Kontextblock und Dateihinweis vollständig beschreibt. Der Testname enthält AT-4.
