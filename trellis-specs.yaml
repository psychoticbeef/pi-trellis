    - id: US-14
      kind: story
      title: Token-Usage pro Story automatisch melden
      body: TypeScript-pi-Extension erfasst Token-Usage von Haupt-Agent und Subagents während aktiver Stories und meldet laufende Deltas am Turn-Ende fehlertolerant per `trellis usage add`.
      status: done
      paths:
        - README.md
        - src/index.ts
        - src/review-gate.ts
        - src/token-usage.ts
        - test/harness.ts
        - test/token-usage.test.ts
        - test/acceptance-token-usage.test.ts
      acceptance_criteria:
        - id: US-14.AC-1
          given: Turn enthält Assistant-Messages mit Usage-Daten und pi-subagents-Records.
          when: Extension Turn abschließt.
          then: Extension summiert Haupt-Agent-Tokens ausschließlich aus Assistant-Usage und Subagent-Tokens ausschließlich aus pi-subagents-Records; LLM liefert oder berechnet keine Werte.
        - id: US-14.AC-2
          given: Turn enthält erfolgreiches `transition start` für Story.
          when: Extension Token-Usage zuordnet.
          then: Gesamter Start-Turn zählt zur Story; alle folgenden Turns zählen bis einschließlich Turn mit erfolgreichem `transition finish`.
        - id: US-14.AC-3
          given: Kein erfolgreich gestartetes, noch nicht erfolgreich beendetes Story-Fenster besteht.
          when: Turn Token-Usage erzeugt.
          then: Extension verwirft Verbrauch und meldet ihn keiner Story.
        - id: US-14.AC-4
          given: Aktiver Story-Turn erzeugt noch nicht gemeldete Haupt-Agent- oder Subagent-Tokens.
          when: Turn endet.
          then: Extension führt `trellis usage add <project-id> <story-id> --main N --subagents N` mit genau diesem Delta aus; `<project-id>` stammt aus `trellis-project` in `AGENTS.md`; Finish-Turn wird vor Schließen des Story-Fensters gemeldet.
        - id: US-14.AC-5
          given: Bereits erfolgreich gemeldete Token-Usage bleibt in Session-Daten sichtbar.
          when: Späterer Turn endet.
          then: Extension meldet nur neues Delta und sendet erfolgreich gemeldete Tokens nicht erneut.
        - id: US-14.AC-6
          given: '`trellis usage add` scheitert, etwa wegen fehlendem Binary oder unbekannter Story.'
          when: Extension Fehler erhält.
          then: Extension zeigt UI-Warnung, blockiert Agenten und Story-Workflow nie und behält ungemeldetes Delta für späteren Turn-End-Versuch.
      approved_content_hash: 5dbc62e7bae8ecb9c44bc90121c7bb7e60494ddda2602954418bd4cd7b9f8ba1
      children:
        - id: AS-14
          kind: arch
          title: Deterministische Token-Usage-Erfassung im Extension-Adapter
          body: Die TypeScript-pi-Extension verbindet bestehende Trellis-Tool-Call/Result-Korrelation aus AS-8 und DD-20 mit turn_end und Lifecycle-Events von pi-subagents. Eine reine StoryUsageTracker-Komponente führt das Story-Fenster, summiert AssistantMessage.usage.totalTokens als Haupt-Agent-Token-Usage und usage.totalTokens aus eindeutigen pi-subagents-Records completed oder failed als Subagent-Token-Usage. Erfolgreiche start- und finish-Results bestimmen Zuordnung; gesamter Start- und Finish-Turn zählt. Eine getrennte asynchrone UsageDeltaReporter-Komponente serialisiert `trellis usage add`, nutzt Project-ID aus AGENTS.md, bestätigt Usage-Delta nur bei Exit-Code 0 und behält fehlgeschlagene Deltas. turn_end stößt Meldung ohne Await und ohne Tool-Gate an; Fehler erzeugen ausschließlich UI-Warnung. Extension setzt aktive Zuordnung nach Verarbeitung des Finish-Turns zurück und verwirft neue Token-Usage außerhalb eines Story-Fensters.
          approved_content_hash: 2de57a9fd68d9d1a7786cad74b73ce281b1fc5003c4cfecd8d11eac7d48584a8
          approved_parent_hash: 5dbc62e7bae8ecb9c44bc90121c7bb7e60494ddda2602954418bd4cd7b9f8ba1
          children:
            - id: DD-31
              kind: detail_design
              title: Story-Fenster und Turn-Zuordnung
              body: src/token-usage.ts exportiert StoryUsageTracker und eine reine Extraktion unterstützter Trellis-transition-Aufrufe für action start und finish. tool_call merkt action und Story-ID über toolCallId; ausschließlich tool_result mit isError=false ändert Story-Fenster. start markiert aktuellen Turn samt gepufferten pi-subagents-Records, finish markiert aktuellen Turn und schließt Story-Fenster erst nach dessen Abrechnung. Turn ohne Story-Fenster verwirft neue Token-Usage. session_start setzt Tracker, Transition-Zuordnungen und Record-Deduplizierung zurück.
              approved_content_hash: fdd40cfc6edde1a679ac4a5c29354c5a40e047328cd1a6892e8e56fd173239d4
              approved_parent_hash: 2de57a9fd68d9d1a7786cad74b73ce281b1fc5003c4cfecd8d11eac7d48584a8
              children:
                - id: UT-31
                  kind: unit_test
                  title: Transition-Erkennung und Story-Fenster
                  body: Unit-Tests prüfen direkte trellis_transition-Namen sowie unterstützte MCP-Gateway-Eingaben für start und finish, erfolglose Results, fremde Actions und Storys, Zuordnung gesamter Start- und Finish-Turns, Schließen nach Finish-Turn sowie Verwerfen außerhalb des Story-Fensters. Jeder Testname enthält ID dieses unit_test.
                  approved_content_hash: 0eff9774812a296bdee4d98822e189a1d3f0ad99b6b0100275dd328a907776d1
                  approved_parent_hash: fdd40cfc6edde1a679ac4a5c29354c5a40e047328cd1a6892e8e56fd173239d4
                  evidence:
                    tests:
                        - test/token-usage.test.ts::UT-31 Transition-Erkennung und Story-Fenster > UT-31 erkennt direkte und MCP-transition-Aufrufe strikt
                        - test/token-usage.test.ts::UT-31 Transition-Erkennung und Story-Fenster > UT-31 rechnet gesamten Start- und Finish-Turn und verwirft Außen-Turns
                    recorded_at: "2026-09-01T13:21:46Z"
            - id: DD-32
              kind: detail_design
              title: Usage-Quellen und eindeutige Deltas
              body: StoryUsageTracker liest Haupt-Agent-Token-Usage ausschließlich aus AssistantMessage.usage.totalTokens am turn_end. pi.events-Listener sammeln pi-subagents-Records aus subagents:completed und subagents:failed, verwenden ausschließlich usage.totalTokens und deduplizieren anhand Record-id; Records ohne gültige nichtnegative Usage zählen null. Tracker erzeugt pro Story und Turn ein Usage-Delta aus Haupt-Agent- und Subagent-Token-Usage. Erfolgreich bestätigte Deltas werden nie erneut erzeugt; neue Deltas bleiben getrennt von bereits laufender Meldung.
              approved_content_hash: 3506ba157cb16ddbfdf44b8148867b4b075190b394771c934a7e8fa9cb812f18
              approved_parent_hash: 2de57a9fd68d9d1a7786cad74b73ce281b1fc5003c4cfecd8d11eac7d48584a8
              children:
                - id: UT-32
                  kind: unit_test
                  title: Assistant- und pi-subagents-Usage
                  body: Unit-Tests prüfen totalTokens aus AssistantMessage-Usage, completed- und failed-pi-subagents-Records, Record-Deduplizierung, fehlende oder ungültige Usage, getrennte Haupt-Agent-/Subagent-Summen sowie keine erneute Ausgabe bereits bestätigter Token-Usage. Jeder Testname enthält ID dieses unit_test.
                  approved_content_hash: 86b43f87b8332ce8f79e813fb649ebad37a1239ccf0f9658a1b59d21491d9d93
                  approved_parent_hash: 3506ba157cb16ddbfdf44b8148867b4b075190b394771c934a7e8fa9cb812f18
                  evidence:
                    tests:
                        - test/token-usage.test.ts::UT-32 Haupt-Agent-Token-Usage und Subagent-Token-Usage aus pi-subagents-Records > UT-32 liest ausschließlich gültige totalTokens und dedupliziert pi-subagents-Records
                        - test/token-usage.test.ts::UT-32 Haupt-Agent-Token-Usage und Subagent-Token-Usage aus pi-subagents-Records > UT-32 sendet erfolgreich bestätigte Token-Usage nicht erneut
                    recorded_at: "2026-09-01T13:21:46Z"
            - id: DD-33
              kind: detail_design
              title: Nicht blockierende CLI-Meldung und Retry
              body: UsageDeltaReporter erhält Project-ID aus dem vorhandenen TrellisProject, hält pending Haupt-Agent- und Subagent-Token-Usage pro Story und serialisiert Meldungen. flush startet über injizierte Exec-Funktion `trellis usage add <project-id> <story-id> --main N --subagents N` ohne Await im turn_end-Handler. Exit-Code 0 zieht exakt gesendetes Usage-Delta ab; Throw oder anderer Exit-Code behält es und ruft injizierte Warnfunktion auf. Nächster turn_end stößt Retry auch nach geschlossenem Story-Fenster an. Reporter wirft nicht in Agent-Hooks und blockiert weder Tool-Call noch Story-Workflow.
              approved_content_hash: 7e138312078e9f9181b334e63e3c2acb14e94afb987fcea459f010f8e497f7cc
              approved_parent_hash: 2de57a9fd68d9d1a7786cad74b73ce281b1fc5003c4cfecd8d11eac7d48584a8
              children:
                - id: UT-33
                  kind: unit_test
                  title: CLI-Argumente, Serialisierung und Retry
                  body: Unit-Tests prüfen exakte Argumentliste für trellis usage add, Project-ID und Story-ID, Exit-Code 0, Nicht-Null-Exit, Throw, Erhalt fehlgeschlagener Usage-Deltas, Retry am nächsten turn_end, neue Token-Usage während laufender Meldung, Warnung und nicht wartenden Hook-Rücklauf. Jeder Testname enthält ID dieses unit_test.
                  approved_content_hash: 03aaa39230a177f24aa7d2b00a17d8232af4bc3d3d8770bb831f210fa372eb03
                  approved_parent_hash: 7e138312078e9f9181b334e63e3c2acb14e94afb987fcea459f010f8e497f7cc
                  evidence:
                    tests:
                        - test/token-usage.test.ts::UT-33 CLI-Argumente, Serialisierung und Retry > UT-33 sendet exakte Usage-Deltas einmal, serialisiert neue Token-Usage und kehrt ohne Await zurück
                        - test/token-usage.test.ts::UT-33 CLI-Argumente, Serialisierung und Retry > UT-33 behält fehlgeschlagene Usage-Deltas, warnt und versucht sie später erneut
                    recorded_at: "2026-09-01T13:21:46Z"
