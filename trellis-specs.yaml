          then: Alle kanonischen Subagent-Rezepte werden überschreibend nach <agent-dir>/agents/ kopiert.
        - id: US-11.AC-3
          given: Das pi-Package liegt außerhalb von <agent-dir>/git/ und <agent-dir>/npm/, oder PI_TRELLIS_SKIP_AGENT_INSTALL ist 1.
