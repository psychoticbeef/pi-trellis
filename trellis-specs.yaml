                  evidence:
                    tests:
                        - test/init-command.test.ts::UT-10 UT-26 Zustandsabhängiger init-Command > UT-10 UT-26 registriert trellis:init und startet ohne Verdrahtung das Onboarding
                        - test/init-command.test.ts::UT-10 UT-26 Zustandsabhängiger init-Command > UT-10 UT-26 sendet mit gültiger Verdrahtung ohne Aktivierungsumweg den Interview-Prompt
                        - test/init-command.test.ts::UT-10 UT-26 Zustandsabhängiger init-Command > UT-26 behandelt eine ungültige trellis-project-Konfiguration als Onboarding-Fall
                    recorded_at: "2026-08-31T12:36:41Z"
            - id: DD-27
              kind: detail_design
              title: Sicherer Onboarding-Prompt mit Gate-Rezepten
              body: src/onboarding-prompt.ts exportiert ONBOARDING_PROMPT. Der Prompt ordnet Repository-Inspektion und Rückfragen vor Mutationen an, verbietet Overwrite vorhandener Dateien, verlangt git init -b develop nur ohne Repository und einen vollständigen Commit aller Änderungen zwingend vor trellis init --name --repo. Er erklärt den danach greifenden Branch-Gate-Hook. trellis config wird ausdrücklich als Shell-CLI-Schritt und nicht über MCP ausgeführt. Die exakten Gate-Rezepte erzeugen für TypeScript/vitest JUnit und LCOV, für Go gotestsum-JUnit und coverprofile sowie für Python/pytest JUnit und LCOV; andere Stacks müssen dieselben parsebaren Artefaktklassen liefern. trellis doctor ist verpflichtende Abnahme, danach folgt der angehängte Interview-Prompt.
              approved_content_hash: 7f50329d0d79f62ce1b1fa7e39701a7b634c44948b6c45117f773920d110b391
