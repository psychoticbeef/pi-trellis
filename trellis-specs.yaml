    - id: US-12
      kind: story
      title: Onboarding-Modus für /trellis:init
      body: /trellis:init erkennt die Trellis-Verdrahtung des aktuellen Projekts. Ohne trellis-project-Zeile führt ein Onboarding-Prompt sicher durch Repository-Inspektion, Skeleton, Vorab-Commit, CLI-basierte Trellis-Einrichtung, stackgerechte Gates und doctor, bevor er nahtlos in den bestehenden Interview-Prompt übergeht.
      status: done
      paths:
        - src/onboarding-prompt.ts
        - src/init-prompt.ts
        - src/index.ts
        - README.md
        - test/init-command.test.ts
        - test/init-prompt.test.ts
        - test/integration-init.test.ts
        - test/acceptance-init.test.ts
        - test/onboarding-prompt.test.ts
        - test/readme.test.ts
      acceptance_criteria:
        - id: US-12.AC-1
          given: Die Extension ist geladen.
          when: Der User führt /trellis:init aus.
          then: Der Command prüft das aktuelle Projekt auf eine gültige trellis-project-Zeile; mit Verdrahtung injiziert er den bestehenden Interview-Prompt, ohne Verdrahtung den Onboarding-Prompt.
        - id: US-12.AC-2
          given: Ein noch nicht mit Trellis verdrahtetes Verzeichnis wird onboarded.
          when: Der Agent den Onboarding-Prompt ausführt.
          then: Er inspiziert zuerst das Repository, erfragt fehlende Angaben zu Zweck, Sprache und Stack, initialisiert bei Bedarf Git mit develop und erstellt ausschließlich fehlende Skeleton-Dateien, ohne vorhandene Dateien zu überschreiben.
        - id: US-12.AC-3
          given: Skeleton oder vorbereitende Dateien wurden erzeugt.
          when: Der Agent Trellis verdrahtet.
          then: Er committet ausdrücklich alle Änderungen vor trellis init, führt erst danach trellis init --name <name> --repo <pfad> über die Shell aus und versucht nach Installation des Branch-Gate-Hooks keine direkten develop-Commits.
        - id: US-12.AC-4
          given: Sprache und Stack sind bekannt.
          when: Der Agent die Gates konfiguriert.
          then: Er verwendet ausschließlich trellis config über die CLI, nutzt die vorgegebenen Rezepte für TypeScript mit vitest, Go oder Python mit pytest beziehungsweise leitet für andere Stacks JUnit-XML plus LCOV oder Go-coverprofile her und schließt mit trellis doctor ab.
        - id: US-12.AC-5
          given: trellis doctor bestätigt die Verdrahtung.
          when: Das Onboarding abgeschlossen wird.
          then: Derselbe Agent fährt ohne erneuten Command mit dem unveränderten bestehenden Interview-Prompt fort.
        - id: US-12.AC-6
          given: Ein neuer User liest den Setup-Abschnitt.
          when: Er den empfohlenen Einrichtungsweg sucht.
          then: README beschreibt /trellis:init als Onboarding-Weg und behält den bisherigen manuellen Ablauf als Fallback bei.
      approved_content_hash: d2b742700000264a655f1543416f1909ea5de4b1af55e2ee3c3772f5d9114a72
      children:
        - id: AS-12
          kind: arch
          title: Zustandsgesteuerter init-Command mit komponierten Prompts
          body: Der registrierte /trellis:init-Command verwendet findTrellisProject mit dem bestehenden injizierbaren Read-Port als Zustandsprüfung, unabhängig vom aktiven Trellis-Modus. Bei gültiger trellis-project-Zeile sendet er unverändert INTERVIEW_PROMPT; bei fehlender oder ungültiger Verdrahtung sendet er genau eine Komposition aus ONBOARDING_PROMPT und INTERVIEW_PROMPT. ONBOARDING_PROMPT ist ein statisches, separat testbares Template. Es erzwingt Repository-Inspektion, fehlende Nutzerangaben, non-destructive Skeleton-Erstellung, Git-Initialisierung auf develop, vollständigen Commit vor trellis init, Shell-Ausführung von trellis init, ausschließlich CLI-basierte Gate-Konfiguration, stackgerechte JUnit-/Coverage-Artefakte, doctor-Abnahme und den anschließenden Übergang zum Interview-Prompt. README stellt Onboarding vor den manuellen Fallback.
          approved_content_hash: f16b988496b93671f3e38cfa239856474672aef92b5233d2ca42e2b295360468
          approved_parent_hash: d2b742700000264a655f1543416f1909ea5de4b1af55e2ee3c3772f5d9114a72
          children:
            - id: DD-26
              kind: detail_design
              title: Zustandserkennung und Prompt-Auswahl im init-Command
              body: Der init-Handler ruft findTrellisProject(ctx.cwd, dependencies.readTextFile) auf. Erfolg bedeutet vorhandene Verdrahtung und führt zu genau einer User-Nachricht mit INTERVIEW_PROMPT. Ein Fundfehler bedeutet unverdrahtetes Projekt und führt zu genau einer User-Nachricht mit dem Onboarding- und anschließend dem unveränderten Interview-Prompt. Andere Commands und die Aktivierungslogik bleiben unverändert.
              approved_content_hash: f7aa946bf0624801ee13a36b04768f4a31f552219e02cfe18ed079f20aee5fff
              approved_parent_hash: f16b988496b93671f3e38cfa239856474672aef92b5233d2ca42e2b295360468
              children:
                - id: UT-26
                  kind: unit_test
                  title: UT-26 Zustandsabhängige init-Prompt-Auswahl
                  body: Unit-Tests prüfen Registrierung, gültige trellis-project-Zeile, fehlende oder ungültige Verdrahtung und jeweils exakt eine User-Nachricht mit der korrekten Prompt-Auswahl. Jeder Testname enthält UT-26.
