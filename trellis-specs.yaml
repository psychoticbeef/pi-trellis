              kind: detail_design
              title: Read-only Rezepte für Change-Review und Reliktsuche
              body: .pi/agents/change-review.md und .pi/agents/relic-hunter.md sind die kanonischen Definitionen im YAML-Frontmatter-Format mit ausschließlich read-only Werkzeugen read, grep, find und bash; src/agent-recipes.ts listet und lädt sie. change-review bestimmt ohne Argument den vollständigen Worktree-Diff und verwendet andernfalls den unverändert gelieferten Git-Range; es lädt get_overview für Description und cross_cutting Specs, ermittelt betroffene Stories aus geänderten Pfaden, liest deren Architektur-Specs und belegt Architekturabweichungen, Schichtverletzungen und Cross-Cutting-Verstöße mit Diff- und Spec-Stellen. relic-hunter führt zuerst npx tsc --noUnusedLocals --noUnusedParameters und bei verfügbarer Installation npx knip aus, dokumentiert fehlende Werkzeuge und nutzt dann Heuristiken für Code- und Spec-Relikte. Beide verändern weder Dateien noch Trellis und liefern ausschließlich belegte Vorschläge.
              approved_content_hash: 988b69e02d2f16f3e054b30bf0fc96ca8cedcd645007d5bd5236fa764cddfbf9
              approved_parent_hash: b8424ada1ecd8235acd21c4a8eeb7d76c91c071f704adb6ee6bbb453fa5d4e88
