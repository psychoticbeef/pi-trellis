                        - test/quality-tools.test.ts::UT-14 Change-Review- und Relic-Hunter-Rezepte > UT-14 beschreibt Diff-Quellen, Trellis-Inputs, Architekturprüfungen und konkrete Belege
                        - test/quality-tools.test.ts::UT-14 Change-Review- und Relic-Hunter-Rezepte > UT-14 führt Reliktmechanik zuerst aus und deckt alle Code- und Spec-Kategorien ab
