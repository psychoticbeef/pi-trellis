    - id: US-9
      kind: story
      title: Auto-Aktivierung und Review-Gate vor finish
      body: Die TypeScript-pi-Extension aktiviert den Trellis-Modus bei session_start automatisch für Projekte mit trellis-project in AGENTS.md. Das ursprüngliche Review-Gate wird durch US-10 als storybezogene Review-Runde mit fünf erfolgreichen read-only Agent-Ergebnissen fortgeführt.
      status: done
      paths:
        - src/index.ts
        - src/review-gate.ts
        - src/token-usage.ts
        - test/acceptance-auto-review.test.ts
        - test/review-gate.test.ts
      acceptance_criteria:
        - id: US-9.AC-1
          given: Die projektlokale AGENTS.md enthält eine gültige trellis-project-Zeile.
          when: session_start ausgelöst wird.
          then: Die Extension aktiviert den Trellis-Modus automatisch mit demselben Zustand, derselben MCP-Validierung, demselben Statusline-Eintrag und derselben UI-Notiz einschließlich Board-Link wie /trellis:on.
        - id: US-9.AC-2
          given: Der Trellis-Modus wurde bei session_start automatisch aktiviert.
          when: /trellis:off ausgeführt wird oder AGENTS.md keine gültige trellis-project-Zeile enthält.
          then: /trellis:off deaktiviert den Trellis-Modus und verhindert bis zum Sitzungsende jede erneute Aktivierung; ohne gültige Zeile bleibt das bisherige Startverhalten unverändert.
        - id: US-9.AC-3
          given: Für eine Story ist die Review-Runde in der aktuellen Sitzung nicht freigeschaltet.
          when: Ein Trellis-transition-Tool-Call mit action=finish für diese Story erfolgt.
          then: Die Extension erkennt den finish-Aufruf und übergibt ihn an das durch US-10 spezifizierte Review-Gate.
        - id: US-9.AC-4
          given: Ein finish-Aufruf wurde durch das Review-Gate blockiert.
          when: Der Agent die Blockbegründung erhält.
          then: Die aktuelle Anweisung verlangt die durch US-10 spezifizierte Review-Runde mit fünf read-only Subagent-Rezepten über das Agent-Tool.
        - id: US-9.AC-5
          given: Die Review-Runde einer Story wurde in der aktuellen Sitzung freigeschaltet.
          when: finish für dieselbe Story erneut erfolgt.
          then: Die Extension lässt den Aufruf gemäß der dauerhaften Sitzungsfreischaltung aus US-10 passieren.
        - id: US-9.AC-6
          given: Die Extension verarbeitet Tool-Calls und Sitzungswechsel.
          when: Andere transition-Actions, finish für eine andere Story oder session_start auftreten.
          then: Andere transition-Actions bleiben unverändert, Review-Gate-Zustand bleibt storyisoliert und session_start setzt ihn gemäß US-10 zurück.
