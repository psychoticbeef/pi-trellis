                        - test/review-gate.test.ts::UT-21 Review-Zustand, Instruktion, Isolation und Fail-open > UT-21 blockiert dreimal, kündigt Fail-open an und lässt den vierten Versuch dauerhaft warnend durch
                        - test/review-gate.test.ts::UT-21 Review-Zustand, Instruktion, Isolation und Fail-open > UT-21 schaltet erst nach fünf Erfolgen frei, isoliert Storys und setzt alles zurück
                    recorded_at: "2026-08-31T07:18:04Z"
            - id: DD-22
              kind: detail_design
              title: Agent-Hook-Korrelation und Foreground-Mutation
              body: src/index.ts erkennt tool_call ausschließlich für Tool Agent und einen subagent_type aus der Fünfermenge. Nur wenn zuletzt eine Story durch ihre Review-Runde geblockt wurde, erhält der Spawn eine pending-Zuordnung über toolCallId; event.input.run_in_background wird in-place auf false gesetzt. Der tool_result-Hook entfernt die pending-Zuordnung und meldet ausschließlich bei event.isError=false den Reviewer-Erfolg an den Controller. Fremde Agent-Typen, Agent-Spawns ohne geblockte Story, Fehler und unbekannte Resultate verändern keinen Fortschritt. Bestehende edit/write-tool_result-Verarbeitung bleibt erhalten. session_start leert Controller und Pending-Zuordnungen.
