          body: Die TypeScript-pi-Extension exportiert einen statischen Interview-Prompt aus einem eigenen Modul und registriert /trellis:init neben den bestehenden Commands. Der Handler prüft die Trellis-Verdrahtung über die Projektfindung statt den In-Memory-Aktivierungszustand des Trellis-Modus. Ohne gültige trellis-project-Zeile sendet er genau eine Komposition aus Onboarding-Prompt und Interview-Prompt; mit gültiger Zeile übergibt er den Interview-Prompt genau einmal als String an pi.sendUserMessage. Der Interview-Prompt bleibt unter 2500 Zeichen und instruiert das LLM zu einem schrittweisen, bestätigungsgebundenen Trellis-Projekt-Interview einschließlich set_description, 2–3 Story-Vorschlägen mit Given/When/Then-Akzeptanzkriterien, cross_cutting Specs, ultra-kurzem Glossar-Grundstock, get_tree, approve_tree und Refinement. Unit-, Integrations- und Acceptance-Tests sichern Inhalt und Verdrahtung.
