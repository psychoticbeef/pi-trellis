trellis_export: 1
project:
    name: pi-trellis
    description: 'pi extension integrating trellis: slash commands, live board link, spec-aware file hints, guided refinement, subagent recipes.'
    base_branch: develop
    release_branch: main
    lint_cmd: npx tsc --noEmit
    test_cmd: npx vitest run --reporter=junit --outputFile=reports/tests.xml --coverage.enabled --coverage.reporter=lcov --coverage.reportsDirectory=reports/coverage
    junit_glob: reports/*.xml
glossary:
    - term: agent-dir
      definition: Basisverzeichnis aus PI_CODING_AGENT_DIR oder ~/.pi/agent.
    - term: Aufbewahrungsfenster
      definition: Anzahl abgeschlossener Turns, die externe read-Results vollständig bleiben.
    - term: Auto-Load
      definition: Projektlokales automatisches Laden der Extension durch pi.
    - term: Auto-Modus
      definition: Sitzungsmodus, der startbare Stories nacheinander bis done bearbeitet.
    - term: Board-Adresse
      definition: Konfigurierbare Live-Board-Basisadresse; Standard http://127.0.0.1:7420.
    - term: Branch-Gate-Hook
      definition: Hook, der direkte Commits auf develop blockiert.
    - term: Context-Hygiene
      definition: Verlustfreie Bereinigung überholter LLM-Kontextinhalte.
    - term: Dateihinweis
      definition: Einmal pro Done-Story und Sitzung eingereihter LLM-Kontexthinweis nach einer zugehörigen Dateiänderung.
    - term: Drei-Prüfer-Check
      definition: Parallele Prüfung durch drei Qualitätsagenten.
    - term: Fail-open
      definition: Warnendes Durchlassen von finish nach drei Blockierungen.
    - term: Gate-Rezept
      definition: Stackbezogene CLI-Konfiguration für Lint, Tests und Coverage.
    - term: Interview-Prompt
      definition: Strukturierte LLM-Anleitung für das geführte Projekt-Interview.
    - term: Kanban-Zusammenfassung
      definition: UI-only Übersicht über Story-Zähler, aktive Arbeit und Risiken.
    - term: Nutzer-Override
      definition: Projektlokales Subagent-Rezept mit Vorrang vor der globalen Datei.
    - term: Onboarding-Modus
      definition: Zustandsabhängige Trellis-Ersteinrichtung über /trellis:init.
    - term: Onboarding-Prompt
      definition: LLM-Anleitung zur sicheren Trellis-Ersteinrichtung.
    - term: pi-Harness
      definition: Test-Doppel der pi-Extension-API.
    - term: pi-Package
      definition: Über package.json oder Konventionsverzeichnisse ladbares pi-Ressourcenpaket.
    - term: pi-subagents-Record
      definition: Lifecycle-Event completed oder failed mit Subagent-Usage.
    - term: Projekt-Skeleton
      definition: Minimale initiale Datei- und Verzeichnisstruktur.
    - term: Reliktsuche
      definition: Read-only Suche nach Code- und Spec-Relikten.
    - term: Review-Gate
      definition: Finish-Sperre bis zur Review-Freigabe oder zum Fail-open.
    - term: Review-Runde
      definition: Storybezogene Prüfung durch fünf erfolgreiche read-only Agent-Ergebnisse vor finish.
    - term: Statusline-Eintrag
      definition: Dezente aktuelle Anzeige der laufenden Story und ihrer Gates.
    - term: Story-Fenster
      definition: Turns vom erfolgreichen start bis einschließlich erfolgreichen finish einer Story.
    - term: Subagent-Rezept
      definition: Markdown-Definition eines spezialisierten Agenten; kanonisch im pi-Package, global installierbar und projektlokal überschreibbar.
    - term: Token-Usage
      definition: Von pi gemeldete Gesamtzahl verbrauchter Tokens.
    - term: Trellis-Kontextblock
      definition: Pro User-Turn injizierte Trellis-Projektübersicht unter 1500 Zeichen.
    - term: Trellis-Modus
      definition: Aktivierte Trellis-Kontextinjektion einer pi-Sitzung.
    - term: Usage-Delta
      definition: Seit letzter erfolgreicher Meldung neu zugeordnete Token-Usage.
    - term: Vorab-Commit
      definition: Vollständiger Projekt-Commit unmittelbar vor trellis init.
    - term: Änderungsreview
      definition: Read-only Architekturprüfung großer Änderungen.
