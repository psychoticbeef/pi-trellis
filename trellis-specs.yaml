        - id: AT-1
          kind: acceptance_test
          title: Trellis-Modus über Commands und User-Turns
          body: 'Eine Black-box-Suite lädt die TypeScript-pi-Extension mit kontrollierter Board-Adresse und einem Fake-Trellis-MCP-Server. Sie prüft: /trellis:on erkennt die AGENTS.md-Projekt-ID, validiert MCP und zeigt den Projektlink; der nächste User-Turn erhält einen aktuellen Trellis-Kontextblock mit allen geforderten Abschnitten und Stringlänge < 1500; fehlende Projekt-ID und MCP-Ausfall lassen den Trellis-Modus aus und melden die konkrete Ursache ohne verfügbaren Link; /trellis:off bestätigt und verhindert weitere Injektion. Der Testname enthält die ID dieses acceptance_test.'
          covers:
