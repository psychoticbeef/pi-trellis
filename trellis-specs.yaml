          body: Ein Acceptance-Test aktiviert den Trellis-Modus und prüft mehrere Results desselben Trellis-Tools über mehrere User-Turns. Überholte Results erhalten den Trellis-Stub; das jüngste Result jedes Tools und alle Results seit der letzten User-Message bleiben vollständig. Results verschiedener Trellis-Tools werden unabhängig behandelt. Der Testname enthält die ID dieses acceptance_test.
