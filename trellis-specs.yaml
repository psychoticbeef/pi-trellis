                  body: Unit-Tests prüfen Argumentvalidierung, deterministische erste Story, normalisierte leere und fehlerhafte Antworten, exakten Umsetzungsauftrag, Generationenschutz und Schwellenfälle 75 Prozent, knapp darüber, fehlende Usage sowie ungültiges contextWindow. Jeder Testname enthält die ID dieses unit_test.
