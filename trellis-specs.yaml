    - id: US-5
      kind: story
      title: Geführtes Projekt-Interview über /trellis:init
      body: Der Slash-Command /trellis:init wählt anhand der Trellis-Verdrahtung zwischen Onboarding-Prompt und dem im Code hinterlegten Interview-Prompt. Der unveränderte Interview-Prompt führt das LLM schrittweise durch Projektbeschreibung, bestätigte Story-Vorschläge mit Given/When/Then-Akzeptanzkriterien, Querschnittsthemen, Glossar-Grundstock sowie abschließendes approve_tree und Refinement.
      status: done
      paths:
        - src/init-prompt.ts
        - src/onboarding-prompt.ts
        - src/index.ts
        - README.md
        - test/init-command.test.ts
        - test/init-prompt.test.ts
        - test/integration-init.test.ts
        - test/acceptance-init.test.ts
        - test/onboarding-prompt.test.ts
        - test/readme.test.ts
      acceptance_criteria:
        - id: US-5.AC-1
          given: Das aktuelle Projekt besitzt keine gültige trellis-project-Zeile.
          when: Der User führt /trellis:init aus.
