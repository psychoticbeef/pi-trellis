                        - test/agent-recipes.test.ts::UT-11 Rezeptformat, Rollen und create-if-absent > UT-11 legt nur fehlende Rezepte an und erhält Vorbestand bytegenau
                    recorded_at: "2026-08-30T18:56:28Z"
            - id: DD-12
              kind: detail_design
              title: Check-Prompt und Slash-Command
              body: src/check-prompt.ts exportiert CHECK_PROMPT als unveränderlichen String. Er fordert das LLM auf, die Verfügbarkeit des Agent-Tools und der Typen spec-sync-check, glossary-warden und relic-hunter zu prüfen, alle drei bei Verfügbarkeit in einem gemeinsamen parallelen Tool-Turn zu spawnen, ihre Ergebnisse als Vorschläge zusammenzuführen und bei fehlendem Agent-Tool oder fehlendem Typ die vollständige Diff-/Done-Baum-, Glossar- und Reliktprüfung inline auszuführen. src/index.ts registriert trellis:check. Der Handler besitzt einen eigenständigen Aktivierungs-Guard für den Trellis-Modus und sendet bei aktivem Trellis-Modus CHECK_PROMPT genau einmal über pi.sendUserMessage; ohne aktiven Modus verweist er auf /trellis:on.
