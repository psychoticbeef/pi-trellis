    - id: US-6
      kind: story
      title: Subagent-Rezepte und Auto-Load
      body: Die Extension stellt drei projektlokale Subagent-Rezepte create-if-absent bereit, ergänzt /trellis:check um eine Agent-Tool-orientierte Prüfung mit Inline-Fallback und wird über committete Projekteinstellungen ohne -e automatisch durch pi geladen.
      status: done
      paths:
        - .pi/settings.json
        - .pi/agents
        - src/agent-recipes.ts
        - src/check-prompt.ts
        - src/index.ts
        - test/agent-recipes.test.ts
        - test/check-command.test.ts
        - test/feature6-acceptance.test.ts
        - test/integration-recipes-check.test.ts
        - test/settings-autoload.test.ts
        - test/integration-package.test.ts
      acceptance_criteria:
        - id: US-6.AC-1
          given: Der Trellis-Modus ist deaktiviert und mindestens eines der drei Subagent-Rezepte .pi/agents/spec-sync-check.md, .pi/agents/glossary-warden.md oder .pi/agents/pre-finish-review.md fehlt beziehungsweise existiert bereits.
          when: Der User führt /trellis:on erfolgreich aus.
          then: Die Extension legt jedes fehlende Subagent-Rezept im Format von @tintinweb/pi-subagents an und lässt jede bereits vorhandene Datei bytegenau unverändert.
        - id: US-6.AC-2
          given: Die drei Subagent-Rezepte sind vorhanden.
          when: Ihre Aufgaben und Werkzeuggrenzen ausgewertet werden.
          then: spec-sync-check liest Diff und betroffene Done-Bäume und meldet veraltete Spec-Knoten ausschließlich als Vorschlagsliste; glossary-warden prüft neue Specs und Code auf Terminologie-Drift gegen das Glossar; pre-finish-review prüft den Worktree-Diff anhand der Akzeptanzkriterien der Story als Checkliste.
        - id: US-6.AC-3
          given: Der Trellis-Modus ist aktiviert.
          when: Der User führt /trellis:check aus.
          then: Der Command injiziert genau einen Prompt, der das LLM anweist, spec-sync-check und glossary-warden über das Agent-Tool zu spawnen, sofern sie verfügbar sind, und andernfalls beide Prüfungen inline durchzuführen.
        - id: US-6.AC-4
          given: Das Repository ist ausgecheckt und als Projekt vertrauenswürdig freigegeben.
          when: pi aus dem Repository mit pi --mode print und ohne -e gestartet wird.
          then: Die committete .pi/settings.json lädt die Extension projektlokal automatisch, sodass ihre Trellis-Commands einschließlich /trellis:check registriert sind.
      approved_content_hash: 507fba9b71687d348aa3edb964e50a722ad0bedff76c435ad7c32edc20f525e1
      children:
        - id: AS-6
          kind: arch
          title: Projektlokale Subagent-Rezepte und Extension-Auto-Load
          body: Die bestehende TypeScript-pi-Extension ergänzt drei statische Markdown-Templates im Frontmatter-Format von @tintinweb/pi-subagents. Nach erfolgreicher /trellis:on-Aktivierung provisioniert ein injizierbarer Dateisystem-Port die Templates atomar mit exklusiver create-if-absent-Semantik unter .pi/agents und überschreibt niemals vorhandene Dateien. Ein statischer Check-Prompt und /trellis:check nutzen pi.sendUserMessage, verlangen bei verfügbarem Agent-Tool parallele Spawns von spec-sync-check und glossary-warden und beschreiben denselben Inline-Fallback. Eine committete .pi/settings.json referenziert aus dem relativ zu .pi aufgelösten extensions-Feld ../extensions/index.ts. Unit-, Integrations-, Acceptance- und echter pi-Print-Prozesstest sichern Inhalte, Verdrahtung und Auto-Load.
          approved_content_hash: 5d028810e5d37798dc4d04d5c8431b1146cdbdc42a335d4bb653271b3a0475a4
          approved_parent_hash: 507fba9b71687d348aa3edb964e50a722ad0bedff76c435ad7c32edc20f525e1
          children:
            - id: DD-11
              kind: detail_design
              title: Templates und create-if-absent-Provisionierung
              body: src/agent-recipes.ts exportiert Dateinamen und unveränderliche Markdown-Inhalte für spec-sync-check, glossary-warden und pre-finish-review. Jedes Template besitzt YAML-Frontmatter mit description, ausschließlich read-only Werkzeugen read, grep, find und bash sowie einen präzisen System-Prompt. spec-sync-check liest den Worktree-Diff, ermittelt betroffene Done-Bäume über Trellis und gibt nur eine Vorschlagsliste veralteter Spec-Knoten aus; glossary-warden vergleicht neue Specs und Code mit dem Glossar; pre-finish-review erstellt aus Worktree-Diff und Story-Akzeptanzkriterien eine Checkliste. ensureAgentRecipes(cwd) erzeugt .pi/agents und öffnet jede Zieldatei exklusiv zur Neuerstellung; EEXIST gilt als Erfolg und bewirkt keinen Lese-/Schreibzyklus. /trellis:on ruft die Provisionierung erst nach erfolgreicher Aktivierung auf und meldet Provisionierungsfehler konkret, ohne vorhandene Dateien zu verändern.
              approved_content_hash: 7a0763cb0536858419ba767b498d3753629944eddc1a4483329766346ca4880a
              approved_parent_hash: 5d028810e5d37798dc4d04d5c8431b1146cdbdc42a335d4bb653271b3a0475a4
              children:
                - id: UT-11
                  kind: unit_test
                  title: UT-11 Rezeptformat, Rollen und create-if-absent
                  body: Unit-Tests parsen Frontmatter und Body aller drei Templates, prüfen die read-only Werkzeugliste und jede geforderte Rolle. Dateisystemtests prüfen Neuanlage, Teilbestand, bytegenaue Erhaltung vorhandener Dateien, wiederholte Aufrufe und konkurrierendes EEXIST-Verhalten. Jeder Testname enthält UT-11.
                  approved_content_hash: b93c3ce8f81e9f621161a8d8549650ca571e00a604cef6a64edb4089c1078b75
                  approved_parent_hash: 7a0763cb0536858419ba767b498d3753629944eddc1a4483329766346ca4880a
                  evidence:
                    tests:
                        - test/agent-recipes.test.ts::UT-11 Rezeptformat, Rollen und create-if-absent > UT-11 liefert gültige read-only Templates mit allen drei Rollen
                        - test/agent-recipes.test.ts::UT-11 Rezeptformat, Rollen und create-if-absent > UT-11 legt nur fehlende Rezepte an und erhält Vorbestand bytegenau
                    recorded_at: "2026-08-30T18:56:28Z"
            - id: DD-12
              kind: detail_design
              title: Check-Prompt und Slash-Command
              body: src/check-prompt.ts exportiert CHECK_PROMPT als unveränderlichen String. Er fordert das LLM auf, die Verfügbarkeit des Agent-Tools und beider Typen zu prüfen, spec-sync-check und glossary-warden bei Verfügbarkeit in einem gemeinsamen parallelen Tool-Turn zu spawnen, ihre Ergebnisse als Vorschläge zusammenzuführen und bei fehlendem Agent-Tool oder fehlendem Typ die entsprechenden Diff-/Done-Baum- und Glossarprüfungen inline auszuführen. src/index.ts registriert trellis:check. Der Handler verwendet denselben Aktivierungs-Guard wie trellis:init und sendet bei aktivem Trellis-Modus CHECK_PROMPT genau einmal über pi.sendUserMessage; ohne aktiven Modus verweist er auf /trellis:on.
              approved_content_hash: 9f3a67e3e82847cf9266f80a2c200be445db7e353eb27108be8da0fdeb02c068
              approved_parent_hash: 5d028810e5d37798dc4d04d5c8431b1146cdbdc42a335d4bb653271b3a0475a4
              children:
                - id: UT-12
                  kind: unit_test
                  title: UT-12 Check-Prompt und Command-Guard
                  body: Unit-Tests prüfen die Pflichtinhalte Agent-Tool, spec-sync-check, glossary-warden, paralleler Spawn und vollständiger Inline-Fallback. Harness-Tests prüfen Registrierung, Modus-Guard, Hinweis auf /trellis:on und exakt einen Versand von CHECK_PROMPT nach Aktivierung. Jeder Testname enthält UT-12.
                  approved_content_hash: 7f7b638889982448aae84475252e234821a69d8a0e97019f713a7b10b13986bc
                  approved_parent_hash: 9f3a67e3e82847cf9266f80a2c200be445db7e353eb27108be8da0fdeb02c068
                  evidence:
                    tests:
                        - test/check-command.test.ts::UT-12 Check-Prompt und Command-Guard > UT-12 beschreibt parallele Agent-Spawns und den vollständigen Inline-Fallback
                        - test/check-command.test.ts::UT-12 Check-Prompt und Command-Guard > UT-12 schützt trellis:check mit dem Trellis-Modus und sendet exakt CHECK_PROMPT
                    recorded_at: "2026-08-30T18:56:28Z"
            - id: DD-13
              kind: detail_design
              title: Committete Projekteinstellungen für Auto-Load
              body: '.pi/settings.json enthält gültiges JSON mit extensions: ["../extensions/index.ts"]. Der Pfad wird gemäß pi-Projekteinstellungen relativ zu .pi aufgelöst und lädt dadurch den bestehenden buildfreien Package-Entry. Ein statischer Test prüft Manifestform und Pfadauflösung. Ein Prozess-Test kopiert das Repository in ein temporäres vertrauenswürdig freigegebenes Projekt, startet pi --mode print ohne -e und lässt einen minimalen Prompt die registrierten Commands über die geladene Extension nachweisen; das Kommando erhält eine begrenzte Laufzeit und eine kontrollierte Modell-/Trust-Konfiguration.'
