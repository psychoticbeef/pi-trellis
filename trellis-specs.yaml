    - id: US-6
      kind: story
      title: Subagent-Rezepte und Auto-Load
      body: Die Extension stellt Subagent-Rezepte aus den committeten .pi/agents-Dateien global create-if-absent bereit, ergänzt /trellis:check um eine Agent-Tool-orientierte Qualitätsprüfung mit Inline-Fallback und wird über committete Projekteinstellungen ohne -e automatisch durch pi geladen.
      status: done
      paths:
        - .pi/settings.json
        - .pi/agents
        - src/agent-recipes.ts
        - src/check-prompt.ts
        - src/index.ts
        - test/agent-recipes.test.ts
        - test/check-command.test.ts
        - test/feature6-acceptance.test.ts
        - test/integration-recipes-check.test.ts
        - test/settings-autoload.test.ts
        - test/integration-package.test.ts
      acceptance_criteria:
        - id: US-6.AC-1
          given: Der Trellis-Modus ist deaktiviert und mindestens eines der fünf Subagent-Rezepte fehlt global und projektlokal beziehungsweise existiert bereits an einem dieser Orte.
          when: Der User führt /trellis:on erfolgreich aus.
          then: Die Extension legt jedes beidseitig fehlende Subagent-Rezept global im Format von @tintinweb/pi-subagents an, lässt jede vorhandene Datei bytegenau unverändert und schreibt nichts in das Zielprojekt.
        - id: US-6.AC-2
          given: Die fünf Subagent-Rezepte sind vorhanden.
          when: Ihre Aufgaben und Werkzeuggrenzen ausgewertet werden.
          then: spec-sync-check meldet veraltete Done-Specs als Vorschlagsliste; glossary-warden prüft Terminologie-Drift; pre-finish-review prüft Story-Akzeptanzkriterien; change-review prüft Architektur- und Cross-Cutting-Konformität; relic-hunter meldet belegte Code- und Spec-Relikte; alle arbeiten read-only.
        - id: US-6.AC-3
          given: Der Trellis-Modus ist aktiviert.
          when: Der User führt /trellis:check aus.
          then: Der Command injiziert genau einen Prompt, der das LLM anweist, spec-sync-check, glossary-warden und relic-hunter über das Agent-Tool parallel zu spawnen, sofern sie verfügbar sind, und andernfalls jede betroffene Prüfung vollständig inline durchzuführen.
        - id: US-6.AC-4
          given: Das Repository ist ausgecheckt und als Projekt vertrauenswürdig freigegeben.
          when: pi aus dem Repository ohne -e gestartet wird.
          then: Die committete .pi/settings.json lädt die Extension projektlokal automatisch, sodass ihre Trellis-Commands einschließlich /trellis:check und /trellis:review registriert sind.
      approved_content_hash: da32f7c06c04e0178880b1a88d9243451cb5f79c03c23f4ba87d01d4fd95c299
      children:
        - id: AS-6
          kind: arch
          title: Globale Subagent-Rezepte und Extension-Auto-Load
          body: Die bestehende TypeScript-pi-Extension liest die statischen Markdown-Templates aus den committeten .pi/agents-Dateien relativ zu import.meta.url. Nach erfolgreicher /trellis:on-Aktivierung provisioniert sie ausschließlich global mit exklusiver create-if-absent-Semantik, sofern das jeweilige Subagent-Rezept weder projektlokal noch global existiert. Ein statischer Check-Prompt und /trellis:check nutzen pi.sendUserMessage, verlangen bei verfügbarem Agent-Tool parallele Spawns von spec-sync-check, glossary-warden und relic-hunter und beschreiben denselben vollständigen Inline-Fallback. Eine committete .pi/settings.json referenziert aus dem relativ zu .pi aufgelösten extensions-Feld ../extensions/index.ts. Unit-, Integrations-, Acceptance- und echter pi-Prozesstest sichern Inhalte, Verdrahtung und Auto-Load.
          approved_content_hash: f6bbc4bb193e1d8d134fc0b6e4c976a5d009b8101b454f4d8184eecd7266bcfb
          approved_parent_hash: da32f7c06c04e0178880b1a88d9243451cb5f79c03c23f4ba87d01d4fd95c299
          children:
            - id: DD-11
              kind: detail_design
              title: Dateibasierte Templates und globaler create-if-absent-Fallback
              body: src/agent-recipes.ts exportiert Dateinamen und lädt die unveränderlichen Markdown-Inhalte für spec-sync-check, glossary-warden, pre-finish-review, change-review und relic-hunter aus .pi/agents relativ zu import.meta.url. Jedes Template besitzt YAML-Frontmatter mit description, ausschließlich read-only Werkzeugen read, grep, find und bash sowie einen präzisen System-Prompt. spec-sync-check liest den Worktree-Diff und meldet veraltete Done-Specs als Vorschlagsliste; glossary-warden vergleicht neue Specs und Code mit dem Glossar; pre-finish-review erstellt eine Akzeptanzkriterien-Checkliste; change-review prüft Architektur- und Cross-Cutting-Konformität; relic-hunter liefert belegte Lösch- oder Aktualisierungsvorschläge für Code- und Spec-Relikte. ensureAgentRecipes(cwd) prüft projektlokalen und globalen Vorbestand und schreibt ein beidseitig fehlendes Rezept exklusiv global; EEXIST gilt als Erfolg. /trellis:on meldet Provisionierungsfehler konkret, ohne vorhandene Dateien oder den Zielprojekt-Worktree zu verändern.
              approved_content_hash: d0c7de54cbff2fe5314f51c205acaa36b726a8cfe4c3592d234088567ad9c092
              approved_parent_hash: f6bbc4bb193e1d8d134fc0b6e4c976a5d009b8101b454f4d8184eecd7266bcfb
              children:
