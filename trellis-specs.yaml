    - id: US-3
      kind: story
      title: Spec-aware Dateihinweise
      body: Die TypeScript-pi-Extension ergänzt den aktiven Trellis-Modus um spec-aware Dateihinweise. Nach Änderungen durch edit oder write prüft sie mit specs_for_path betroffene Done-Storys und reiht je Story und Sitzung höchstens einen Dateihinweis für den nächsten User-Turn ein; die aktuell in_progress befindliche Story bleibt ausgenommen.
      status: done
      acceptance_criteria:
        - id: US-3.AC-1
          given: Der Trellis-Modus ist aktiv und specs_for_path ordnet eine durch einen erfolgreichen edit- oder write-Tool-Call geänderte Datei einer Story mit Status done zu.
          when: Der Tool-Call abgeschlossen ist.
          then: Der kurze Dateihinweis „Datei X betrifft Story Y – sind deren Specs/Tests noch aktuell?“ wird mit deliverAs nextTurn in den LLM-Kontext eingereiht, ohne einen Turn auszulösen.
        - id: US-3.AC-2
          given: Für eine Done-Story wurde in der laufenden Sitzung bereits ein Dateihinweis eingereiht.
          when: Weitere Dateien derselben Story durch edit oder write geändert werden.
          then: Es wird kein weiterer Dateihinweis für diese Story erzeugt; eine andere betroffene Done-Story erhält weiterhin ihren eigenen einmaligen Dateihinweis.
        - id: US-3.AC-3
          given: specs_for_path ordnet die geänderte Datei der aktuell in_progress befindlichen Story zu.
          when: Der Trellis-Modus aktiv ist und die Datei geändert wird.
          then: Für diese Story wird kein Dateihinweis erzeugt, auch wenn weitere Änderungen an ihren Dateien erfolgen.
        - id: US-3.AC-4
          given: Der Trellis-Modus ist inaktiv, der Tool-Call schlägt fehl oder ändert keine Datei, oder specs_for_path liefert keine zugehörige Done-Story.
          when: Ein edit- oder write-Tool-Call verarbeitet wird.
          then: Es wird kein Dateihinweis in den LLM-Kontext eingereiht.
      approved_content_hash: 99ce28bbac8f3bb776664a38d4318f21529e41601a5de2aae9ac0a725eaa20c4
      children:
        - id: AS-3
          kind: arch
          title: Tool-Ergebnis-basierte Dateihinweise der Trellis-Extension
          body: Die bestehende TypeScript-pi-Extension registriert tool_call und tool_result für edit und write. tool_call erfasst pro Tool-Call den normalisierten Dateipfad und den Inhalt vor der Mutation; tool_result verarbeitet nur erfolgreiche tatsächliche Inhaltsänderungen im aktiven Trellis-Modus. Der bestehende MCP-Port erhält specsForPath(projectId, path, signal), startet wie getOverview einen eigenen stdio-Client und ruft specs_for_path auf. Für jede zurückgegebene Story mit Status done, außer der aktuell in_progress befindlichen Story, sendet die Extension den Dateihinweis über pi.sendMessage mit deliverAs nextTurn und ohne triggerTurn. Eine sitzungsinterne Menge bereits berücksichtigter Story-IDs verhindert Wiederholungen. Deaktivierung, Fehlschläge, unveränderte Inhalte, leere Treffer und MCP-Fehler erzeugen keinen Dateihinweis. Injizierbare Datei- und MCP-Abhängigkeiten sowie reine Auswahl- und Formatierungsfunktionen halten den Lebenszyklus testbar.
          approved_content_hash: b1cfcd967d455682f15b4092534b4fd2f84c0fa19918adee67ca72e3729b6e07
          approved_parent_hash: 99ce28bbac8f3bb776664a38d4318f21529e41601a5de2aae9ac0a725eaa20c4
          children:
            - id: DD-5
              kind: detail_design
              title: Dateiänderung erkennen, Storys auswählen und sitzungsintern deduplizieren
              body: Ein Pending-Record je toolCallId speichert für edit/write den aus event.input.path relativ zu ctx.cwd normalisierten Pfad und einen optionalen Vorher-Inhalt. Beim zugehörigen tool_result werden fehlerhafte Ergebnisse verworfen und der aktuelle Inhalt verglichen; nur eine tatsächliche Änderung setzt die Verarbeitung fort. Aus specsForPath werden ausschließlich Storys mit Status done gewählt; Storys mit Status in_progress werden ausgeschlossen. Eine Set<string>-Menge im Extension-Lebenszyklus reserviert jede Story-ID vor dem Senden, sodass parallele oder spätere Treffer höchstens einen Dateihinweis pro Story und Sitzung erzeugen. Der Formatter erzeugt „Datei X betrifft Story Y – sind deren Specs/Tests noch aktuell?“. pi.sendMessage erhält deliverAs nextTurn und kein triggerTurn. Fehler beim Lesen oder bei specsForPath werden ohne Dateihinweis abgefangen.
              approved_content_hash: 6ad1bb0fafa600d7f58f7622354b00b97c74b427644aff3db90a243ad9584d11
              approved_parent_hash: b1cfcd967d455682f15b4092534b4fd2f84c0fa19918adee67ca72e3729b6e07
              children:
                - id: UT-5
                  kind: unit_test
                  title: UT-5 Änderungserkennung, Auswahl, Format und Deduplizierung
                  body: Unit-Tests prüfen normalisierte relative und absolute Pfade, neue/geänderte gegenüber unveränderten Dateien, fehlerhafte Tool-Ergebnisse, done-/in_progress-/leere Treffer, mehrere Storys, wiederholte und parallele Treffer sowie den exakten Dateihinweis. Sie prüfen insbesondere deliverAs nextTurn und das Fehlen von triggerTurn. Jeder Testname enthält UT-5.
                  approved_content_hash: d7850328e738815c62c2eaa09fb811f7bd154df036d70388a559d690fd129a25
                  approved_parent_hash: 6ad1bb0fafa600d7f58f7622354b00b97c74b427644aff3db90a243ad9584d11
                  evidence:
                    tests:
                        - test/file-hints.test.ts::UT-5 Änderungserkennung, Auswahl, Format und Deduplizierung > UT-5 normalisiert Projektpfade und formatiert den exakten Dateihinweis
                        - test/file-hints.test.ts::UT-5 Änderungserkennung, Auswahl, Format und Deduplizierung > UT-5 wählt nur eindeutige noch nicht berücksichtigte Done-Storys
                        - test/file-hints.test.ts::UT-5 Änderungserkennung, Auswahl, Format und Deduplizierung > UT-5 erkennt Änderungen, dedupliziert je Story und verwendet nextTurn ohne Turn-Trigger
                        - test/file-hints.test.ts::UT-5 Änderungserkennung, Auswahl, Format und Deduplizierung > UT-5 unterdrückt unveränderte, fehlerhafte und im inaktiven Trellis-Modus ausgeführte Mutationen
                    recorded_at: "2026-08-30T15:00:36Z"
            - id: DD-6
              kind: detail_design
              title: MCP-Aufruf und Parser für specs_for_path
              body: TrellisMcpClient kapselt den gemeinsamen initialize-/tools/call-Lebenszyklus und ergänzt specsForPath(projectId, path, signal). Der Tool-Aufruf verwendet name specs_for_path und arguments { path }. Ein strikter Parser akzeptiert structuredContent oder JSON-Textinhalt und liefert Story-Referenzen mit id, title und status; ungültige Antwortformen werden als TrellisMcpError behandelt. Abort, Timeout, Prozessende und Aufräumen entsprechen getOverview.
              approved_content_hash: 6a264c33dde27f1443c63c78e8872d1fc143dd7634dc310fb75d86ae8d7f2c73
              approved_parent_hash: b1cfcd967d455682f15b4092534b4fd2f84c0fa19918adee67ca72e3729b6e07
              children:
                - id: UT-6
                  kind: unit_test
                  title: UT-6 specs_for_path-Protokoll und Antwortparser
                  body: Unit-Tests treiben einen Fake-stdio-Prozess und prüfen initialize, tools/call mit specs_for_path und Pfadargument, structuredContent und JSON-Text, leere Treffer sowie ungültige Antworten, Timeout und Abort. Jeder Testname enthält UT-6.
                  approved_content_hash: c6249f61daf95f59d5ad2046e39149572f6b185f4d9e3b028866987f57d6626a
                  approved_parent_hash: 6a264c33dde27f1443c63c78e8872d1fc143dd7634dc310fb75d86ae8d7f2c73
                  evidence:
                    tests:
                        - test/mcp-specs-for-path.test.ts::UT-6 specs_for_path-Protokoll und Antwortparser > UT-6 sendet specs_for_path mit Pfad und parst structuredContent
                        - test/mcp-specs-for-path.test.ts::UT-6 specs_for_path-Protokoll und Antwortparser > UT-6 parst JSON-Text und leere Treffer
                        - test/mcp-specs-for-path.test.ts::UT-6 specs_for_path-Protokoll und Antwortparser > UT-6 lehnt ungültige Antworten konkret ab
                        - test/mcp-specs-for-path.test.ts::UT-6 specs_for_path-Protokoll und Antwortparser > UT-6 unterstützt Abort und Timeout für specs_for_path
                    recorded_at: "2026-08-30T15:00:36Z"
            - id: IT-3
              kind: integration_test
              title: IT-3 edit/write-Hooks mit specs_for_path über MCP-stdio
              body: Eine Integration-Suite lädt die TypeScript-pi-Extension mit echten tool_call-/tool_result-Hooks, temporären Dateien und einem Fake-Trellis-MCP-Prozess. Sie ändert Dateien per edit/write-Ereignisfolge, prüft den tools/call-Aufruf von specs_for_path und den eingereihten Dateihinweis mit deliverAs nextTurn ohne Turn-Trigger sowie die Unterdrückung nach /trellis:off. Der Testname enthält IT-3.
              approved_content_hash: 9f87c2cb0b2a833a629ec0578826928c27cf7522f8c6dd4d6c878a80c7d3376e
              approved_parent_hash: b1cfcd967d455682f15b4092534b4fd2f84c0fa19918adee67ca72e3729b6e07
              evidence:
                tests:
                    - test/integration-file-hints.test.ts::IT-3 edit/write-Hooks mit specs_for_path über MCP-stdio > IT-3 verbindet Dateiänderung, MCP-Aufruf, nextTurn-Dateihinweis und Deaktivierung
                recorded_at: "2026-08-30T15:00:36Z"
        - id: AT-3
          kind: acceptance_test
          title: AT-3 Spec-aware Dateihinweise im Trellis-Modus
          body: Eine Black-box-Suite lädt die TypeScript-pi-Extension mit Datei-, MCP- und Nachrichten-Spies. Sie aktiviert den Trellis-Modus und prüft für erfolgreiche edit/write-Änderungen Dateihinweise für Done-Storys, genau einmal pro Story und Sitzung, getrennte Hinweise für weitere Done-Storys, die Ausnahme der aktuell in_progress befindlichen Story sowie die vollständige Unterdrückung bei inaktivem Trellis-Modus, Fehlern, unveränderten Dateien oder fehlenden Done-Treffern. Sie beweist deliverAs nextTurn ohne Turn-Trigger. Der Testname enthält AT-3.
          covers:
            - US-3.AC-1
            - US-3.AC-2
            - US-3.AC-3
            - US-3.AC-4
          approved_content_hash: 47671f57c22236df9ec26517fe43ea21d4b51834c8118ded236bebae2ef707d7
          approved_parent_hash: 99ce28bbac8f3bb776664a38d4318f21529e41601a5de2aae9ac0a725eaa20c4
          evidence:
            tests:
                - test/acceptance-file-hints.test.ts::AT-3 Spec-aware Dateihinweise im Trellis-Modus > AT-3 erfüllt Done-Hinweise, Sitzungs-Deduplizierung, in_progress-Ausnahme und Unterdrückung
            recorded_at: "2026-08-30T15:00:36Z"
    - id: US-4
      kind: story
      title: Repository als pi-Package paketieren
      body: Das Repository wird als buildfreies pi-Package paketiert. Ein TypeScript-Entry unter extensions re-exportiert die bestehende Extension, package.json deklariert pi-Core-Pakete ausschließlich als peerDependencies und ein kurzes README dokumentiert Installation, Commands, Trellis-Kontextblock und Dateihinweis.
      status: done
      acceptance_criteria:
        - id: US-4.AC-1
          given: Das Repository ist lokal ausgecheckt.
          when: Es mit pi -e <repo-pfad> oder als lokaler packages-Eintrag geladen wird.
          then: pi entdeckt die Extension über extensions, deren TypeScript-Entry src/index.ts re-exportiert; es sind weder Build-Schritt noch dist-Artefakte erforderlich.
        - id: US-4.AC-2
          given: Das Repository wird als pi-Package installiert oder gepackt.
          when: pi beziehungsweise npm dessen package.json auswertet.
          then: Das Manifest deklariert die Extension und das Keyword pi-package; importierte pi-Core-Pakete wie @earendil-works/pi-coding-agent stehen mit Range * in peerDependencies und weder in dependencies noch in bundledDependencies.
        - id: US-4.AC-3
          given: Ein User öffnet das Repository ohne Vorwissen.
          when: Er das README liest.
          then: Er findet eine kurze Anleitung für lokale Installation beziehungsweise einen packages-Eintrag, die Commands /trellis:on, /trellis:off und /trellis:status sowie verständliche Erklärungen zu Trellis-Kontextblock und Dateihinweis.
      approved_content_hash: 29e08c1f493f77bf7eb8d576f20ccee1789dfd9300ec4dec9f07fb427017ff45
      children:
        - id: AS-4
          kind: arch
          title: Buildfreies pi-Package nach Konventionslayout
          body: Das Repository ergänzt extensions/index.ts als TypeScript-Entry, der die Default-Factory und öffentlichen Exporte aus src/index.ts re-exportiert. package.json kennzeichnet das pi-Package mit dem Keyword pi-package und verweist im pi.extensions-Manifest auf extensions. Importierte pi-Core-Pakete werden mit Range * in peerDependencies deklariert und fehlen in dependencies sowie bundledDependencies; TypeScript bleibt direkt durch pis jiti-Loader ausführbar, ohne Build-Skript oder dist. Ein README dokumentiert lokale Installation per pi -e und packages-Eintrag sowie /trellis:on, /trellis:off, /trellis:status, Trellis-Kontextblock und Dateihinweis. Statische Manifest-/Dokumenttests und ein Laufzeitimport des Package-Entry sichern die Paketierung.
          approved_content_hash: 9377d1cd161d7dcd791453287b1e377261e6dbec94d6e2064f5eee65302f2053
          approved_parent_hash: 29e08c1f493f77bf7eb8d576f20ccee1789dfd9300ec4dec9f07fb427017ff45
          children:
            - id: DD-7
              kind: detail_design
              title: Konventionsentry und Package-Metadaten
              body: extensions/index.ts enthält ausschließlich TypeScript-Re-Exports der Default-Factory und öffentlichen API aus ../src/index.js. package.json enthält keywords mit pi-package und pi.extensions mit ./extensions. Jedes aus Produktionscode importierte pi-Core-Paket steht mit * in peerDependencies; diese Namen fehlen in dependencies und bundledDependencies. Es gibt weder Build-Skript noch dist-Pfad im Manifest. Ein Pakettest liest das Manifest, prüft Entry und Abhängigkeitsgrenzen und validiert die npm-Packliste.
              approved_content_hash: 7ec14f96e0863afbd3da3aab593827b4b93b2071f910b0640c05513609dea9db
              approved_parent_hash: 9377d1cd161d7dcd791453287b1e377261e6dbec94d6e2064f5eee65302f2053
              children:
                - id: UT-7
                  kind: unit_test
                  title: UT-7 Package-Layout und Manifestregeln
                  body: Unit-Tests prüfen extensions/index.ts, pi.extensions, pi-package, peerDependencies mit Range *, das Fehlen von pi-Core-Paketen in dependencies und bundledDependencies sowie das Fehlen eines notwendigen Build-/dist-Artefakts. Jeder Testname enthält UT-7.
                  approved_content_hash: ff117d4988d8268ee967e8fd5cf86ebadb68e07800d631dd053efdf4a6474647
                  approved_parent_hash: 7ec14f96e0863afbd3da3aab593827b4b93b2071f910b0640c05513609dea9db
                  evidence:
