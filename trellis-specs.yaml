                  kind: unit_test
                  title: Review-Zustand, Instruktion, Isolation und Fail-open
                  body: Unit-Tests prüfen die vollständige Fünf-Reviewer-Anweisung, fehlende Reviewer, drei Blocks, Ankündigung im dritten Block, warnendes Durchlassen beim vierten Versuch, Freischaltung nach fünf Erfolgen, dauerhafte Freischaltung, Story-Isolation und reset. Jeder Testname enthält die ID dieses unit_test.
