            - id: DD-30
              kind: detail_design
              title: Command-, MCP-, finish- und Compaction-Integration
              body: src/index.ts registriert /trellis:auto mit on/off-Parsing sowie tool_result und agent_settled. Aktivierung verlangt aktiven Trellis-Modus, setzt Auto-Modus atomar und startet genau eine nächste-Story-Abfrage. src/mcp-client.ts stellt nextStory(projectId, signal) über dasselbe sichere stdio-JSON-RPC-Protokoll bereit. Ein erfolgreiches, vom bestehenden finish-Parser erkanntes Tool-Result markiert Fortsetzung; erst agent_settled konsumiert sie. Bei Nutzung > 75 Prozent ruft der Handler ctx.compact auf und setzt ausschließlich in onComplete fort; onError meldet Fehler ohne automatischen User-Turn. Sonst sendet pi.sendUserMessage direkt. Keine nächste Story deaktiviert den Auto-Modus mit UI-Meldung. session_start und /trellis:auto off setzen Zustand zurück; fehlgeschlagene finish-Results bleiben wirkungslos.
              approved_content_hash: 6764ea361b99f3787d6ff0d2243e5ec9ec5a74c76a059c2ddbccd11ab86a5db8
