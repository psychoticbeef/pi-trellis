    - id: US-10
      kind: story
      title: Review-Gate v2 mit verifizierten Reviews
      body: Die Review-Runde vor finish verlangt fünf read-only Subagent-Rezepte, bestätigt ihre erfolgreichen Agent-Ergebnisse storybezogen und schützt mit sitzungsgebundener Freischaltung sowie begrenztem Fail-open vor Deadlocks.
      status: done
      paths:
        - src/review-gate.ts
        - src/index.ts
        - src/token-usage.ts
        - test/harness.ts
        - test/review-gate.test.ts
        - test/acceptance-auto-review.test.ts
        - test/acceptance-review-gate-v2.test.ts
      acceptance_criteria:
        - id: US-10.AC-1
          given: Eine Story ist aktiv und ihre Review-Runde ist in dieser Sitzung nicht freigeschaltet.
          when: finish wird für diese Story aufgerufen.
          then: Das Gate blockiert, bis pre-finish-review, relic-hunter, spec-sync-check, glossary-warden und change-review erfolgreich beobachtet wurden; der erste Block-Text enthält weiterhin die vollständige Anweisung, alle fünf read-only über das Agent-Tool parallel zu starten, und jeder Block nennt die noch fehlenden Reviewer.
        - id: US-10.AC-2
          given: Die Review-Runde einer Story wurde zuletzt durch finish blockiert.
          when: Das Agent-Tool wird mit einem der fünf Reviewer als subagent_type aufgerufen und liefert danach ein tool_result.
          then: Der tool_call-Hook ordnet den Spawn dieser Story zu, erzwingt durch Input-Mutation run_in_background=false, und ausschließlich ein zugehöriges Ergebnis mit event.isError=false markiert den Reviewer erfolgreich; Fehler oder fehlende Ergebnisse zählen nicht.
        - id: US-10.AC-3
          given: Mehrere der fünf Reviewer werden als Sibling-Agent-Aufrufe gestartet.
          when: Ihre Inputs werden auf run_in_background=false gesetzt.
          then: Die Siblings können weiterhin parallel laufen und jedes Ergebnis wird separat der zuletzt geblockten Review-Runde zugeordnet.
        - id: US-10.AC-4
          given: Erfolgreiche Reviews wurden für eine Story beobachtet.
          when: finish wird für dieselbe oder eine andere Story aufgerufen.
          then: Reviews zählen nur für ihre zugeordnete Story; nach fünf Erfolgen lässt das Gate finish passieren und schaltet diese Story für den Rest der Sitzung frei.
        - id: US-10.AC-5
          given: Eine Story wurde in dieser Sitzung bereits durch das Review-Gate freigeschaltet, aber ein nachgelagerter Gate-Fehler verhinderte ihren Abschluss.
          when: finish wird für dieselbe Story wiederholt.
          then: Das Review-Gate blockiert nicht erneut und verlangt keine Wiederholung der Review-Runde.
        - id: US-10.AC-6
          given: Die fünf Review-Erfolge sind für eine Story nicht vollständig beobachtbar.
          when: finish wird für dieselbe Story wiederholt aufgerufen.
          then: Die ersten drei Aufrufe blockieren, wobei der dritte Block das bevorstehende Fail-open ankündigt; der vierte Aufruf passiert mit deutlicher Warnung und schaltet die Story für den Rest der Sitzung frei.
        - id: US-10.AC-7
          given: Review-Fortschritt, Block-Zähler oder Freischaltungen bestehen in der aktuellen Sitzung.
          when: session_start beginnt eine neue Sitzung.
          then: Sämtlicher Zustand des Review-Gates ist zurückgesetzt.
      approved_content_hash: 12857458dce5abaf29cf157c7734a093e4c0fd26f869a3ded6bd66498731c9cc
      children:
        - id: AS-10
          kind: arch
          title: Verifiziertes sitzungsgebundenes Review-Gate im Extension-Adapter
          body: src/review-gate.ts kapselt Reviewer-Menge, vollständige parallele Agent-Anweisung, storybezogenen Fortschritt, drei Block-Versuche und dauerhafte Sitzungsfreischaltung. src/token-usage.ts kapselt die gemeinsame reine Trellis-transition-Erkennung; src/review-gate.ts exportiert darauf basierend die finish-Erkennung. src/index.ts verbindet den synchronen finish-tool_call-Guard mit Agent-tool_call-Input-Mutation und Agent-tool_result-Erfolgskorrelation. Review-Spawns werden der Story zugeordnet, deren Review-Runde zuletzt blockiert wurde; nur event.isError=false zählt. session_start leert den gesamten Zustand. Betroffene Pfade sind src/review-gate.ts, src/token-usage.ts, src/index.ts, test/harness.ts, test/review-gate.test.ts und test/acceptance-review-gate-v2.test.ts.
          approved_content_hash: bd5189ca9e5689c4452aefb7f27ff86d3f5bcaefa85d09694b8f97a212e1be9a
          approved_parent_hash: 12857458dce5abaf29cf157c7734a093e4c0fd26f869a3ded6bd66498731c9cc
          children:
            - id: DD-21
              kind: detail_design
              title: Storybezogener Review-Zustand und Fail-open
              body: src/review-gate.ts exportiert die unveränderliche Menge pre-finish-review, relic-hunter, spec-sync-check, glossary-warden und change-review sowie einen zustandsbehafteten ReviewGate-Controller. Ein finish registriert die zuletzt geblockte Story, erhöht höchstens drei Block-Zähler und liefert einen Block-Text mit vollständiger Anweisung, alle fünf read-only via Agent-Tool in einem parallelen Tool-Turn zu starten, plus Liste fehlender Reviewer. Der dritte Text kündigt Fail-open an. Beim vierten unvollständigen finish liefert der Controller eine Warnung ohne Block und schaltet die Story frei. Fünf erfolgreiche Reviewer schalten sie ebenfalls frei. Freigeschaltete Storys bleiben bis reset frei; Review-Fortschritt und Zähler sind storyisoliert.
              approved_content_hash: 7ff7093234071c26f3eff245374149b529418fabcf9f4496fadfab614b8465ea
              approved_parent_hash: bd5189ca9e5689c4452aefb7f27ff86d3f5bcaefa85d09694b8f97a212e1be9a
              children:
