          when: ensureAgentRecipes bei der Aktivierung läuft.
          then: Es schreibt das fehlende Subagent-Rezept ausschließlich global und create-if-absent; vorhandene globale oder projektlokale Nutzer-Overrides bleiben unverändert und im Zielprojekt entsteht keine Datei.
