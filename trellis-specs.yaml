      title: Subagent-Rezepte global aus Git-Dateien installieren
      body: Subagent-Rezepte haben ihre Single Source of Truth in .pi/agents. Installierte pi-Packages verteilen sie per npm postinstall kanonisch global; die Aktivierung schreibt nie in Zielprojekte und provisioniert global nur als Fallback.
      status: done
