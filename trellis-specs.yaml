                  body: Unit-Tests prüfen die Reihenfolge Inspektion, Rückfragen, Skeleton, Vorab-Commit, trellis init, trellis config, trellis doctor und Interview; außerdem Overwrite-Verbot, develop-Initialisierung, CLI-statt-MCP-Grenze und die exakten TypeScript-, Go- und Python-Kommandos mit JUnit und LCOV beziehungsweise coverprofile. Jeder Testname enthält UT-27.
